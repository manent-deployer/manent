# manent application configuration (manent -c configs/manent.yml ...)
app:
  name: manent
  # DBOS workflow version (not the binary's): a worker resumes only the workflows of its own
  # version. Change it only when the release notes say so.
  version: 0.1.0

dbos:
  # Overridable with DBOS_SYSTEM_DATABASE_URL. Several nodes need Postgres: postgres://user:pass@host:5432/manent
  database_url: sqlite:manent.db
  # Worker ID: unique across nodes and stable across restarts (e.g. the pod name of a StatefulSet).
  # On restart a worker resumes only the interrupted deploys with its own ID. Default: hostname; DBOS__VMID takes precedence.
  # executor_id: manent-0
  queue: deployments
  concurrency: 4                # deploys running on each worker
  global_concurrency: 0         # deploys running on all workers (0 = no limit)
  environment_concurrency: 1    # concurrent deploys of the same application/environment on all workers
  schedule_poll_interval: 30s   # how often recurring schedule changes are read again
  # On shutdown the worker stops dequeuing deploys and waits for the running ones up to this time.
  drain_timeout: 2m
  # Wave rollouts across several regions (docs: Wave rollouts): every worker declares its region
  # and runs only the passes on that region's targets.
  # region: eu-1
  # region_routing: true

# Health gate of wave rollouts.
rollout:
  # prometheus_url: http://prometheus:9090
  # alertmanager_url: http://alertmanager:9093
  check_timeout: 30s

# Dependencies between deploys (after) and composite releases (docs: Deploy chains).
chains:
  poll_interval: 5s

# Worker registry and recovery of a lost worker's workflows (docs: Recovery, shutdown and retention).
recovery:
  heartbeat_interval: 15s
  stale_after: 1m
  # With a value > 0 the pending workflows of a same-version worker stopped or without heartbeat
  # for this long are resumed by another worker. 0 = only manent-server admin recover.
  auto_recover_after: 0s

# Workflow history cleanup: 0 = never. The last keep_releases releases of every environment stay.
retention:
  max_age: 0s         # e.g. 2160h (90 days)
  keep_releases: 10
  interval: 1h

# Periodic reading of the release in service on the targets, to report in the inventory those
# changed outside manent (docs: Governance, Real state of the targets). 0s = disabled.
reconcile:
  interval: 0s        # e.g. 10m
  timeout: 30s
  concurrency: 8

# Metrics, probes and tracing (docs: Observability).
observability:
  # listen: ":9090"   # /metrics, /healthz, /readyz on a dedicated port (needed by workers)
  metrics: true
  tracing:
    enabled: false
    # endpoint: otel-collector:4318   # default OTEL_EXPORTER_OTLP_ENDPOINT
    # insecure: true
    sample_ratio: 1

http:
  listen: ":8080"

logging:
  level: info             # debug | info | warn | error
  format: text            # text | json

siem:
  enabled: false
  network: udp            # udp | tcp
  address: siem.example.com:514

# Local directory where artifacts are downloaded (shared if several executors)
workdir: ./work

# Deploy configuration of every environment (plugin, targets, parameters, secret references),
# read at the start of every deploy and merged with the descriptor: the descriptor can only add
# what is not defined here, conflicting values fail the deploy.
envconfig:
  provider: none          # none | consul | file
  required: false         # true: fails if the environment has no configuration
  max_retries: 3
  consul:
    address: http://127.0.0.1:8500     # default: CONSUL_HTTP_ADDR
    datacenter: ""
    key: "manent/{application}/{environment}"
    # token: from CONSUL_HTTP_TOKEN or from a file
    # token_file: /run/secrets/consul-token
  file:
    path: "./examples/envconfig/{application}/{environment}.yml"

# HTTP callbacks named in descriptors (callbacks section): they receive the outcome of steps and deploy.
callbacks:
  timeout: 10s
  max_retries: 3          # extra attempts; an undelivered callback does not fail the deploy
  allow_http: false       # https only by default
  allowed_hosts: []       # allowed hosts, also "*.example.com"; empty = all

# Automatic rollback: if a deploy fails, the steps already run are undone, bringing the
# environment back to the previous release. The policy is per artifact type:
# allowed says whether rollback is possible, enabled is the default (descriptor and
# environment configuration can change it, within allowed).
# Unlisted types do not allow rollback.
rollback:
  locator: plugin          # how to find the previous release: plugin = read from the targets
  artifact_types:
    application:
      allowed: true
      enabled: false       # true to enable it by default (remote-copy requires layout: releases)
      on: [deploy, post-test, activation]   # steps whose failure starts the rollback
    container:             # images released with the container plugin (Docker/Podman on VMs)
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    kubernetes:            # manifests released with the kubernetes plugin
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    ecs:                   # ECS services: back to the previous task definition
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    lambda:                # Lambda functions: moves the alias back to the previous version
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    war:                   # applications on JBoss/WildFly: reactivates the previous deployment
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    ear:
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    cloudrun:              # Cloud Run services: traffic on the previous revision
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    migration:
      allowed: false       # database migrations are usually not reversible

# Integrations: Slack and Teams notifications, approvals from Slack and change tickets
# (docs/content/guida/integrazioni.md). The *_ref references point to the secret manager.
# integrations:
#   public_url: https://manent.example.com
#   language: it
#   slack:
#     bot_token_ref: "vault:secret/data/manent/slack#bot_token"
#     signing_secret_ref: "vault:secret/data/manent/slack#signing_secret"   # approval buttons
#     identities:
#       U024BE7LH: {subject: "oidc:alice", groups: [cab]}
#     # email_identity: "oidc:{email}"
#   notifications:
#     - {name: prod, applications: ["*"], environments: [prod], slack: {channel: C0123456789}}
#     - {name: cab, applications: ["*"], environments: ["prod*"], events: [approval], teams: {webhook_ref: "vault:secret/data/manent/teams#webhook"}}
#   change:
#     provider: servicenow              # or jira
#     servicenow:
#       url: https://acme.service-now.com
#       username: manent
#       password_ref: "vault:secret/data/manent/servicenow#password"
#       fields: {assignment_group: "Release Management", cmdb_ci: "{application}"}
#     # jira:
#     #   url: https://acme.atlassian.net
#     #   username: manent@acme.com
#     #   token_ref: "vault:secret/data/manent/jira#token"
#     #   project: CHG
#     #   issue_type: Change
#     #   approved_statuses: [Approved]
#     #   rejected_statuses: [Declined]
#     #   transitions: {start: Implement, success: Done, failure: Failed}
# With change management, in the governance rules:
#   governance: {rules: [{name: prod, applications: ["*"], environments: [prod], change: {approval: true, timeout: 72h}}]}

# API authentication. none = no authentication nor permissions: development only.
# In production: mode enabled with OIDC (users) and/or static tokens (CI).
auth:
  mode: none
  # oidc:
  #   issuer: https://sso.example.com/realms/corp
  #   audience: manent                  # client ID expected in the aud claim
  #   username_claim: preferred_username
  #   groups_claim: groups
  # tokens:                             # only the token's sha256: printf '%s' "$TOKEN" | sha256sum
  #   - name: ci-pipeline
  #     sha256: "<hex sha256>"
  #     groups: [ci]
  #     expires_at: 2027-06-30T00:00:00Z  # optional
  # tokens_file: /etc/manent/tokens.yml   # same format (tokens key), reloaded on change: revocation without restart

# Permissions per application and environment (with auth.mode enabled).
# Predefined roles: viewer, tester (+ dry-run), approver (viewer + approvals),
# deployer (+ deploy, cancel and manual rollback), operator (+ schedules), admin (everything, freeze overrides too).
rbac:
  roles: {}                             # extra roles: name -> [actions]
  bindings: []
  # - groups: [team-a]
  #   role: deployer
  #   applications: ["team-a-*"]
  #   environments: [dev, test]
  # - groups: [release-managers]
  #   role: operator
  #   applications: ["*"]
  #   environments: [prod]
  # - groups: [cab]                     # change advisory board: approves production deploys
  #   role: approver
  #   applications: ["*"]
  #   environments: [prod]
  # - subjects: ["token:ci-pipeline"]
  #   role: deployer
  #   applications: ["*"]
  #   environments: [test]

# Audit: besides the log and the SIEM, optionally an append-only JSON Lines file, with a hash
# chain verifiable with "manent-server audit verify".
audit:
  file: ""
  # max_size_mb: 100                    # rotation (0 = none)
  # hmac_key_ref: "vault:secret/data/manent/audit#key"   # chain not recomputable without the key

# Release rules: mandatory promotion, approvals and freeze windows.
governance:
  # engine: builtin                     # builtin (rules below) | opa (Rego policies, docs: guida/policy)
  # refresh: 10s                        # reread of policy and runtime freezes (manent freeze add)
  # max_staleness: 10m                  # beyond this without a successful read, real deploys are refused
  # start: deny                         # deny | strict (refuse deploys whose obligations grew after submission)
  # opa:
  #   source: store                     # store (manent policy push/approve) | file | bundle | consul
  #   store: {review: true, tests: run} # four eyes; tests: required refuses revisions without tests
  #   file: {dir: /etc/manent/policies}
  #   bundle:
  #     url: https://policies.example.com/manent/bundle.tar.gz
  #     credentials_ref: vault:secret/data/manent/bundle#token
  #     signing: {public_key_ref: file:/etc/manent/bundle.pub}
  #   consul: {prefix: manent/policies}
  rules: []                             # the first matching rule wins
  # - name: production
  #   applications: ["*"]
  #   environments: [prod]
  #   requires: [preprod]               # the same artifact must already have been released to preprod
  #   approvals: {required: 1, timeout: 72h}   # allow_self: false, when: before (default; rollout = at the approvalsBetween points)
  #   # approvals: {required: 2, approvers: {groups: [dba]}}   # only these identities can approve
  freezes: []
  # - name: year-end
  #   reason: accounting close
  #   applications: ["*"]
  #   environments: [prod]
  #   from: 2026-12-20T00:00:00+01:00
  #   to: 2027-01-07T00:00:00+01:00
  # - name: weekend
  #   applications: ["*"]
  #   environments: [prod]
  #   cron: "0 18 * * FRI"              # start of every occurrence (5 fields)
  #   duration: 62h
  #   timezone: Europe/Rome

# What a descriptor can add to the environment configuration.
# Without this section there are no limits (development only). Example for production:
# descriptor_policy:
#   params:
#     remote-copy: [dest_dir, verify_checksum, keep_releases]   # never the commands (post_command, ...)
#     container: [container_name, wait_timeout]                 # never run_args and command
#     kubernetes: [wait_timeout, "var.*", "helm_value.*"]        # namespace and credentials only from the envconfig
#     ecs: [wait_timeout]                                         # service, role_arn and credentials only from the envconfig
#     lambda: [wait_timeout]
#     cloudrun: [wait_timeout]
#     jboss: [suspend, suspend_timeout, reload, restart, wait_timeout]   # user, secrets and server groups only from the envconfig
#   secret_refs: ["vault:secret/data/{application}/*"]
#   targets: false

# Secret providers besides env: and file:.
secrets:
  vault:
    enabled: false
    # address: https://vault.example.com:8200   # default VAULT_ADDR
    # auth: approle                            # token (VAULT_TOKEN or token_file) | approle | kubernetes
    # approle: {role_id: manent, secret_id_file: /etc/manent/vault-secret-id}
    # kubernetes: {role: manent}

# Artifact downloads: allowed sources and their credentials.
artifacts:
  timeout: 30m
  allow_unlisted: true                  # false in production: only the listed sources
  sources: []
  # - prefix: https://nexus.example.com/repository/releases/
  #   auth: {type: basic, username: manent, secret_ref: "vault:secret/data/manent/nexus#password"}
  #   ca_file: /etc/ssl/certs/corp-ca.pem
  # - prefix: file:///srv/artifacts/
  # - prefix: oci://registry.example.com/team/   # container images (digest = sha256)
  #   auth: {type: basic, username: manent, secret_ref: "vault:secret/data/manent/registry#password"}

# Available steps, in execution order.
# mode: mandatory (always run) | optional (enabled = default, which the descriptor can override)
pipeline:
  steps:
    - name: secrets
      mode: mandatory
    - name: artifacts
      mode: mandatory
      max_retries: 3
    - name: qa
      mode: optional
      enabled: true
    - name: deploy
      mode: mandatory
      max_retries: 2
    - name: post-test
      mode: optional
      enabled: false
      max_retries: 5
    - name: activation
      mode: optional
      enabled: true
    # Custom steps: commands on the targets over SSH or HTTP requests, defined only here.
    # See docs/content/guida/step-personalizzati.md.
    # - name: db-migrate
    #   mode: optional
    #   type: command
    #   max_retries: 0
    #   timeout: 15m
    #   secrets: [db-admin]
    #   ssh: {user: migrator, key_secret: ssh-migrate}
    #   params:
    #     database: {pattern: "[a-z][a-z0-9_]{0,62}", required: true}
    #   run:
    #     run_once: true
    #     command: ["/opt/tools/migrate", "up", "--to", "{{ .Version }}", "--db", "{{ .Params.database }}"]
    #   dry_run:
    #     command: ["/opt/tools/migrate", "plan", "--to", "{{ .Version }}", "--db", "{{ .Params.database }}"]
    #     secrets: [db-readonly]
  # custom:
  #   spec_key_refs: ["vault:secret/data/manent/pipeline#spec_key"]   # signature of the specs in plans
  #   revoked_specs: []                                              # sha256 of the revoked specs
  #   known_hosts: ~/.ssh/known_hosts
  #   secrets_dir: /dev/shm/manent

# Active plugins and their configuration
plugins:
  remote-copy:
    known_hosts: ~/.ssh/known_hosts
    insecure_ignore_host_key: false
    artifact_types: [application]
  # Container images on servers and VMs over SSH, with Docker or Podman (oci:// artifacts).
  container:
    known_hosts: ~/.ssh/known_hosts
    insecure_ignore_host_key: false
    artifact_types: [container]
  # Manifests on Kubernetes clusters with server-side apply (one target per cluster).
  kubernetes:
    # ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt   # manent in the cluster
    insecure_skip_tls_verify: false
    artifact_types: [kubernetes]
    # helm:                # Helm charts (.tgz from helm package), rendered with helm template
    #   command: helm      # included in the manent-server image
    #   sha256: ""         # verification of the binary at every rendering
    #   timeout: 2m
  # Managed cloud services: one target per region. AWS credentials from the SDK default chain
  # (IRSA, task or instance role) or from the *_secret and role_arn parameters;
  # Google from the Application Default Credentials or from credentials_secret.
  ecs:                     # images on Amazon ECS services (target: region or region/cluster)
    artifact_types: [ecs]
    # endpoint: http://localhost:4566   # LocalStack
  lambda:                  # AWS Lambda function code (ECR image or .zip), with alias
    artifact_types: [lambda]
  cloudrun:                # images on Google Cloud Run services (project parameter)
    artifact_types: [cloudrun]
  # war/ear applications on JBoss EAP and WildFly through the HTTP management API (standalone or
  # domain controller; target: management host and port, default 9993 with https).
  jboss:
    artifact_types: [war, ear]
    # ca_file: /etc/manent/jboss-ca.pem
    # insecure_skip_tls_verify: false
    # request_timeout: 10m   # maximum duration of a call, upload included
  # External plugin: separate binary started by manent at the first deploy (make plugins).
  # The other keys, besides external, are the configuration passed to the plugin.
  # remote-copy-ext:
  #   external:
  #     command: bin/manent-plugin-remote-copy
  #     sha256: "<sha256 of the binary>"   # verified at activation and at every start
  #     env: {}                           # the plugin does not inherit the worker environment
  #     start_timeout: 1m
  #   known_hosts: ~/.ssh/known_hosts
  #   artifact_types: [application]
