openapi: 3.1.0
info:
  title: manent API
  version: v1
  description: |
    API di manent: deploy, rilasci a ondate, governance, log e metriche. Tutte le rotte sotto
    /api/v1 richiedono un bearer token (OIDC o token statico) quando l'autenticazione è attiva;
    i permessi sono quelli di RBAC per applicazione e ambiente. Le risposte di errore hanno la
    forma {"error": "<messaggio>"}.

    Questa specifica è il contratto tra server, interfaccia web e client: un test confronta le
    rotte registrate dal server con i percorsi qui sotto.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: deployments
  - name: governance
  - name: schedules
  - name: insight
  - name: access
  - name: platform
  - name: releases
  - name: policies
  - name: tenants
  - name: ui
  - name: probes

paths:
  /api/v1/deployments:
    post:
      tags: [deployments]
      summary: Accoda un deploy, lo pianifica o crea una schedule ricorrente
      operationId: submitDeployment
      parameters:
        - name: dry_run
          in: query
          schema: {type: boolean}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Descriptor'}
      responses:
        '202': {description: Deploy accodato, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '201': {description: Schedule ricorrente creata o aggiornata, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      tags: [deployments]
      summary: Elenca i deploy più recenti
      operationId: listDeployments
      parameters:
        - {name: schedule, in: query, schema: {type: string}}
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, default: 50}}
        - name: cursor
          in: query
          description: next_cursor della pagina precedente
          schema: {type: string}
      responses:
        '200':
          description: Deploy dal più recente
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments: {type: array, items: {$ref: '#/components/schemas/Status'}}
                  next_cursor: {type: string, description: Presente se la pagina è piena}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/plan:
    post:
      tags: [deployments]
      summary: Calcola gli step che verrebbero eseguiti
      operationId: planDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Descriptor'}
      responses:
        '200':
          description: Piano
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: {type: array, items: {$ref: '#/components/schemas/PlannedStep'}}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/validate:
    post:
      tags: [deployments]
      summary: Verifica il descrittore come all'accodamento, senza accodarlo
      operationId: validateDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Descriptor'}
      responses:
        '200': {description: Deploy effettivo, content: {application/json: {schema: {$ref: '#/components/schemas/Validation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/environments/validate:
    post:
      tags: [deployments]
      summary: Verifica una configurazione di ambiente candidata, prima di applicarla
      description: |
        Fonde la configurazione (YAML o JSON, come nel sistema di configurazione) con il descrittore
        di esempio (default: la richiesta del deploy in esercizio) e applica le verifiche
        dell'accodamento: campi sconosciuti, policy sui descrittori, fusione, rollback, piano delle
        ondate e del traffico. Non accoda e non scrive nulla.
      operationId: validateEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentCheck'}
      responses:
        '200': {description: Deploy effettivo con la configurazione candidata, content: {application/json: {schema: {$ref: '#/components/schemas/Validation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}:
    get:
      tags: [deployments]
      summary: Stato di un deploy
      operationId: getDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Stato, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/steps:
    get:
      tags: [insight]
      summary: Step registrati del deploy
      operationId: getDeploymentSteps
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200':
          description: Step
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps: {type: array, items: {$ref: '#/components/schemas/StepRecord'}}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/logs:
    get:
      tags: [insight]
      summary: Righe di log del deploy a partire da offset
      operationId: getDeploymentLogs
      parameters:
        - {$ref: '#/components/parameters/id'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Pagina di log, content: {application/json: {schema: {$ref: '#/components/schemas/LogPage'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/events:
    get:
      tags: [insight]
      summary: Stato e log del deploy come Server-Sent Events
      description: |
        Eventi "status" (Status in JSON, quando cambia), "log" (array di LogLine; id = offset
        successivo, ripreso con Last-Event-ID), "end" alla conclusione, "error" se la lettura
        fallisce. Commenti ": keep-alive" ogni 15 secondi senza eventi.
      operationId: streamDeploymentEvents
      parameters:
        - {$ref: '#/components/parameters/id'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200':
          description: Stream di eventi
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/cancel:
    post:
      tags: [deployments]
      summary: Annulla un deploy in attesa o in esecuzione
      operationId: cancelDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '204': {description: Annullato}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/approve:
    post:
      tags: [governance]
      summary: Approva un deploy (prima del deploy o tra due ondate)
      operationId: approveDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '204': {description: Decisione registrata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/reject:
    post:
      tags: [governance]
      summary: Respinge un deploy
      operationId: rejectDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '204': {description: Decisione registrata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/approvals:
    get:
      tags: [governance]
      summary: Deploy in attesa che l'utente può approvare
      operationId: listApprovals
      responses:
        '200':
          description: Approvazioni in attesa
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals: {type: array, items: {$ref: '#/components/schemas/Status'}}
  /api/v1/promotions:
    post:
      tags: [governance]
      summary: Rilascia in un ambiente l'artefatto già rilasciato in un altro
      operationId: promote
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteRequest'}
      responses:
        '202': {description: Promozione accodata, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/rollbacks:
    post:
      tags: [governance]
      summary: Rilascia di nuovo una versione precedente
      operationId: rollback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '202': {description: Rollback accodato, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/inventory:
    get:
      tags: [governance]
      summary: Release in esercizio per applicazione e ambiente
      operationId: getInventory
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
      responses:
        '200':
          description: Inventario
          content:
            application/json:
              schema:
                type: object
                required: [inventory]
                properties:
                  inventory: {type: array, items: {$ref: '#/components/schemas/InventoryEntry'}}
  /api/v1/freezes:
    get:
      tags: [governance]
      summary: Finestre di freeze attive e future
      operationId: listFreezes
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
      responses:
        '200':
          description: Finestre
          content:
            application/json:
              schema:
                type: object
                required: [freezes]
                properties:
                  freezes: {type: array, items: {$ref: '#/components/schemas/WindowStatus'}}
    post:
      tags: [governance]
      summary: Crea una finestra di freeze a runtime (freeze.write)
      operationId: createFreeze
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeRequest'}
      responses:
        '201': {description: Finestra creata, content: {application/json: {schema: {$ref: '#/components/schemas/WindowStatus'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/freezes/{name}:
    delete:
      tags: [governance]
      summary: Elimina una finestra di freeze creata a runtime (freeze.write)
      operationId: deleteFreeze
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Eliminata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: Tenant del registro (filtrati dai permessi)
      operationId: listTenants
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: selector, in: query, description: Selettore sui tag e sul nome, schema: {type: string}}
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants: {type: array, items: {$ref: '#/components/schemas/TenantInfo'}}
  /api/v1/tenants/{name}:
    get:
      tags: [tenants]
      summary: Un tenant
      operationId: getTenant
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '200': {description: Tenant, content: {application/json: {schema: {$ref: '#/components/schemas/TenantInfo'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/policies:
    get:
      tags: [policies]
      summary: Revisioni della policy di governance (policy.read)
      operationId: listPolicies
      responses:
        '200': {description: Revisioni e policy in vigore, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyList'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      tags: [policies]
      summary: Carica una revisione in bozza, dopo compilazione e test (policy.write)
      operationId: pushPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyPush'}
      responses:
        '201': {description: Revisione in bozza, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRevision'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}:
    get:
      tags: [policies]
      summary: Una revisione con i suoi file (policy.read)
      operationId: getPolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      responses:
        '200': {description: Revisione, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRevision'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/evaluate:
    post:
      tags: [policies]
      summary: Decisione di una revisione su un descrittore (policy.write)
      operationId: evaluatePolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyEvaluationRequest'}
      responses:
        '200': {description: Input e decisione, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyEvaluation'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/impact:
    get:
      tags: [policies]
      summary: Decisioni dei deploy reali del periodo ricalcolate con la revisione (policy.write)
      operationId: policyImpact
      parameters:
        - {$ref: '#/components/parameters/revision'}
        - name: since
          in: query
          description: Data RFC 3339, durata (720h) o giorni (30d); default 7 giorni
          schema: {type: string}
      responses:
        '200': {description: Deploy con una decisione diversa, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyImpact'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/approve:
    post:
      tags: [policies]
      summary: Approva e attiva una revisione in bozza (policy.approve, un'identità diversa dall'autore)
      operationId: approvePolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      responses:
        '204': {description: Attivata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/activate:
    post:
      tags: [policies]
      summary: Torna a una revisione già attiva in passato (policy.approve)
      operationId: activatePolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      responses:
        '204': {description: Attivata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/metrics/dora:
    get:
      tags: [insight]
      summary: Metriche DORA
      operationId: getDORA
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
        - {name: by, in: query, description: "tenant: metriche anche per tenant", schema: {type: string, enum: [tenant]}}
        - name: since
          in: query
          description: Data RFC 3339, durata (720h) o giorni (30d); default 30 giorni
          schema: {type: string}
      responses:
        '200': {description: Metriche, content: {application/json: {schema: {$ref: '#/components/schemas/DORAReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/schedules:
    get:
      tags: [schedules]
      summary: Schedule ricorrenti
      operationId: listSchedules
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: {type: array, items: {$ref: '#/components/schemas/ScheduleInfo'}}
  /api/v1/schedules/{name}:
    get:
      tags: [schedules]
      summary: Una schedule
      operationId: getSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '200': {description: Schedule, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleInfo'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [schedules]
      summary: Elimina una schedule
      operationId: deleteSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Eliminata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/schedules/{name}/pause:
    post:
      tags: [schedules]
      summary: Sospende una schedule
      operationId: pauseSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Sospesa}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/schedules/{name}/resume:
    post:
      tags: [schedules]
      summary: Riprende una schedule
      operationId: resumeSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Ripresa}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      tags: [access]
      summary: Identità della richiesta e ruoli che le si applicano
      operationId: getMe
      responses:
        '200': {description: Identità, content: {application/json: {schema: {$ref: '#/components/schemas/Identity'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/workers:
    get:
      tags: [platform]
      summary: Worker registrati con stato, heartbeat e workflow in esecuzione (permesso platform.read)
      operationId: listWorkers
      responses:
        '200':
          description: Worker
          content:
            application/json:
              schema:
                type: object
                required: [workers]
                properties:
                  workers: {type: array, items: {$ref: '#/components/schemas/Worker'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/queues:
    get:
      tags: [platform]
      summary: Code DBOS di manent con limiti, workflow in coda, in esecuzione e pianificati e worker in ascolto (permesso platform.read)
      operationId: listQueues
      responses:
        '200':
          description: Code
          content:
            application/json:
              schema:
                type: object
                required: [queues]
                properties:
                  queues: {type: array, items: {$ref: '#/components/schemas/Queue'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/activity:
    get:
      tags: [platform]
      summary: Deploy non conclusi (in esecuzione, in attesa di approvazione, in coda, pianificati)
      operationId: getActivity
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
      responses:
        '200': {description: Attività, content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/releases:
    post:
      tags: [releases]
      summary: Accoda una release composta (più deploy con dipendenze)
      operationId: submitRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Release'}
      responses:
        '202': {description: Release accodata, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseStatus'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      tags: [releases]
      summary: Release più recenti
      operationId: listReleases
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases: {type: array, items: {$ref: '#/components/schemas/ReleaseStatus'}}
  /api/v1/releases/{id}:
    get:
      tags: [releases]
      summary: Stato di una release e dei suoi deploy
      operationId: getRelease
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Release, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseStatus'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/releases/{id}/cancel:
    post:
      tags: [releases]
      summary: Annulla i deploy non conclusi della release e la release
      operationId: cancelRelease
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '204': {description: Annullata}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /ui/config.json:
    get:
      tags: [ui]
      summary: Configurazione pubblica dell'interfaccia web
      operationId: getUIConfig
      security: []
      responses:
        '200': {description: Configurazione, content: {application/json: {schema: {$ref: '#/components/schemas/UIConfig'}}}}
  /integrations/slack/interactions:
    post:
      tags: [integrations]
      summary: Clic sui pulsanti di approvazione dei messaggi Slack (Interactivity Request URL dell'app)
      description: >-
        Autenticata dalla firma di Slack (X-Slack-Signature, X-Slack-Request-Timestamp), non da un bearer.
        La decisione è registrata con l'identità di manent associata all'utente Slack; l'esito arriva
        all'utente con un messaggio effimero.
      operationId: slackInteractions
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: {type: string, description: Payload JSON dell'interazione (block_actions)}
      responses:
        '200': {description: Ricevuta}
        '401': {description: Firma non valida o richiesta scaduta}
        '503': {description: Integrazione non disponibile}
  /healthz:
    get:
      tags: [probes]
      summary: Il processo risponde
      operationId: healthz
      security: []
      responses:
        '200': {description: OK}
  /readyz:
    get:
      tags: [probes]
      summary: Il processo è pronto (database raggiungibile, non in drain)
      operationId: readyz
      security: []
      responses:
        '200': {description: Pronto}
        '503': {description: Non pronto}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string}
    name:
      name: name
      in: path
      required: true
      schema: {type: string}
    revision:
      name: revision
      in: path
      required: true
      description: Numero della revisione, oppure current per quella in vigore
      schema: {type: string}
  requestBodies:
    Decision:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              comment: {type: string}
  responses:
    Error:
      description: Errore
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Descriptor:
      type: object
      description: Descrittore di deploy (vedi la guida "Il descrittore" della documentazione).
      additionalProperties: true
      required: [apiVersion, application, environment, artifact]
      properties:
        apiVersion: {type: string, examples: [manent/v1]}
        id: {type: string}
        application: {type: string}
        environment: {type: string}
        tenant: {type: string, description: Tenant del deploy}
        tenants:
          type: object
          description: Rilascio a più tenant (names o selector, groups, maxParallel, onFailure, onDenied, approvalsBetween)
          additionalProperties: true
        dryRun: {type: boolean}
        after: {type: array, items: {type: string}, description: ID dei deploy che devono riuscire prima di questo}
        afterTimeout: {type: string, description: Attesa massima delle dipendenze (default 24h)}
        artifact:
          type: object
          required: [type, name, source]
          properties:
            type: {type: string}
            name: {type: string}
            version: {type: string}
            source: {type: string}
            sha256: {type: string}
    DeployTargets:
      type: object
      description: Sezione deploy di un descrittore (plugin, target, parametri).
      additionalProperties: true
    PlannedStep:
      type: object
      additionalProperties: true
      properties:
        name: {type: string}
        max_retries: {type: integer}
        type:
          type: string
          description: Tipo dello step personalizzato (command, http); assente per gli step standard.
        spec_hash:
          type: string
          description: Sha256 della specifica dello step personalizzato, come in pipeline.custom.revoked_specs. Comandi e URL non sono esposti.
    Submission:
      type: object
      required: [state]
      properties:
        id: {type: string}
        state: {type: string}
        scheduled_at: {type: string, format: date-time}
        schedule: {type: string}
        dry_run: {type: boolean}
        tenants: {type: array, items: {type: string}, description: Tenant di un rilascio multi-tenant}
        skipped: {type: array, items: {$ref: '#/components/schemas/TenantSkip'}}
    Decision:
      type: object
      required: [approver, approve, time]
      properties:
        approver: {type: string}
        approve: {type: boolean}
        comment: {type: string}
        time: {type: string, format: date-time}
    ApprovalState:
      type: object
      required: [status, required, expires_at]
      properties:
        status: {type: string, enum: [pending, approved, rejected, expired]}
        required: {type: integer}
        allow_self: {type: boolean}
        approvers: {$ref: '#/components/schemas/Approvers'}
        expires_at: {type: string, format: date-time}
        decisions: {type: array, items: {$ref: '#/components/schemas/Decision'}}
        change: {$ref: '#/components/schemas/ChangeTicket'}
    ChangeTicket:
      type: object
      description: Ticket di change management (ServiceNow, Jira) del deploy
      required: [number]
      properties:
        id: {type: string, description: Identificativo tecnico nel sistema ITSM}
        number: {type: string, description: Riferimento leggibile, es. CHG0031337}
        url: {type: string}
        approval: {type: string, enum: [pending, approved, rejected]}
    RolloutPass:
      type: object
      required: [name, hosts]
      properties:
        name: {type: string}
        region: {type: string}
        az: {type: string}
        hosts: {type: array, items: {type: string}}
        drained: {type: array, items: {type: string}, description: Membri del pool fuori dal load balancer in questo momento}
    RolloutStage:
      type: object
      required: [name, wave, state, passes]
      properties:
        name: {type: string}
        wave: {type: string}
        state: {type: string, enum: [pending, running, baking, succeeded, failed, rolled-back]}
        passes: {type: array, items: {$ref: '#/components/schemas/RolloutPass'}}
        gate: {type: string, description: Ultimo controllo rosso dell'health gate}
        score: {type: number, description: Punteggio dell'analisi canary (0-100) all'ultima lettura del gate}
        error: {type: string}
    RolloutState:
      type: object
      required: [status, stages, on_failure]
      properties:
        strategy: {type: string, enum: [waves, traffic], description: Vuoto per i rilasci a ondate}
        status: {type: string, enum: [planned, running, paused-approval, paused-freeze, paused-drift, succeeded, failed]}
        stage: {type: string}
        paused: {type: string}
        stages: {type: array, items: {$ref: '#/components/schemas/RolloutStage'}}
        approval: {$ref: '#/components/schemas/ApprovalState'}
        on_failure: {type: string}
        rollback: {type: string}
        traffic: {$ref: '#/components/schemas/TrafficState'}
    TrafficState:
      type: object
      description: Rilascio per percentuale (strategy traffic); gli stadi sono i gradini
      required: [weight, steps]
      properties:
        pass: {type: string, description: Passo in corso nei rilasci a ondate}
        router: {type: string}
        stable: {type: string, description: Slot della versione stabile}
        candidate: {type: string, description: Slot della versione candidata}
        weight: {type: integer, description: Quota di traffico corrente della candidata}
        steps: {type: array, items: {type: integer}}
        testers: {type: boolean}
        promoted: {type: boolean}
    StepResult:
      type: object
      required: [name]
      properties:
        name: {type: string}
        output: {type: object, additionalProperties: {type: string}}
    Result:
      type: object
      required: [deployment_id, steps]
      properties:
        deployment_id: {type: string}
        dry_run: {type: boolean}
        steps: {type: array, items: {$ref: '#/components/schemas/StepResult'}}
        rollout: {$ref: '#/components/schemas/RolloutState'}
        change: {$ref: '#/components/schemas/ChangeTicket'}
    Status:
      type: object
      required: [id, state, created_at, updated_at]
      properties:
        id: {type: string}
        state:
          type: string
          description: ENQUEUED, DELAYED, PENDING, SUCCESS, ERROR, CANCELLED, AWAITING_APPROVAL, REJECTED, EXPIRED, WAITING_DEPENDENCY, DEPENDENCY_FAILED, MAX_RECOVERY_ATTEMPTS_EXCEEDED
        application: {type: string}
        environment: {type: string}
        tenant: {type: string}
        artifact: {type: string}
        version: {type: string}
        sha256: {type: string}
        kind: {type: string, enum: [deploy, promotion, rollback, tenants]}
        source: {type: string, description: Deploy di origine di una promozione o di un rollback}
        dry_run: {type: boolean}
        rollback: {type: string, description: Esito del rollback automatico}
        requested_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        scheduled_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, description: Inizio dell'esecuzione sul worker}
        executor: {type: string, description: Worker che esegue o ha eseguito il deploy}
        queue: {type: string}
        last_step: {type: string, description: Ultimo step registrato di un deploy in corso (solo in /activity)}
        approval: {$ref: '#/components/schemas/ApprovalState'}
        change: {$ref: '#/components/schemas/ChangeTicket'}
        after: {$ref: '#/components/schemas/AfterState'}
        release: {type: string, description: Release composta a cui appartiene il deploy}
        policy: {$ref: '#/components/schemas/PolicySnapshot'}
        tenants_run: {$ref: '#/components/schemas/TenantsRunState'}
        run: {type: string, description: Rilascio multi-tenant a cui appartiene il deploy}
        rollout: {$ref: '#/components/schemas/RolloutState'}
        rollout_progress: {type: string, description: '"stadi superati/stadi totali"'}
        result: {$ref: '#/components/schemas/Result'}
        error: {type: string}
    AfterState:
      type: object
      required: [status, expires_at, dependencies]
      properties:
        status: {type: string, enum: [waiting, satisfied, failed, expired]}
        expires_at: {type: string, format: date-time}
        dependencies:
          type: array
          items:
            type: object
            required: [id, state]
            properties:
              id: {type: string}
              state: {type: string}
        reason: {type: string}
    Release:
      type: object
      required: [apiVersion, kind, id, deploys]
      properties:
        apiVersion: {type: string, examples: [manent/v1]}
        kind: {type: string, enum: [Release]}
        id: {type: string}
        onFailure: {type: string, enum: [stop, continue, rollback]}
        deploys:
          type: array
          items:
            type: object
            required: [name, descriptor]
            properties:
              name: {type: string}
              descriptor: {$ref: '#/components/schemas/Descriptor'}
              after: {type: array, items: {type: string}, description: Nomi di altri deploy della release}
    ReleaseStatus:
      type: object
      required: [id, state, on_failure, created_at, updated_at, deploys]
      properties:
        id: {type: string}
        state: {type: string, description: PENDING, SUCCESS, ERROR, CANCELLED}
        on_failure: {type: string, enum: [stop, continue, rollback]}
        requested_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        error: {type: string}
        deploys:
          type: array
          items:
            type: object
            required: [name, deployment_id, application, environment, state]
            properties:
              name: {type: string}
              deployment_id: {type: string}
              application: {type: string}
              environment: {type: string}
              version: {type: string}
              after: {type: array, items: {type: string}}
              state: {type: string}
              error: {type: string}
              rollback_id: {type: string}
              rollback_state: {type: string}
    Worker:
      type: object
      required: [id, state, tasks]
      properties:
        id: {type: string, description: Executor ID DBOS}
        state: {type: string, enum: [alive, stale, stopped, unregistered]}
        version: {type: string, description: Versione dei workflow (app.version)}
        build: {type: string, description: Versione del binario}
        hostname: {type: string}
        region: {type: string}
        started_at: {type: string, format: date-time}
        heartbeat_at: {type: string, format: date-time}
        stopped_at: {type: string, format: date-time}
        recovered_by: {type: string}
        recovered_at: {type: string, format: date-time}
        pending: {type: object, additionalProperties: {type: integer}, description: Workflow in sospeso per versione dei workflow}
        queues: {type: array, items: {type: string}, description: Code DBOS da cui il worker preleva}
        resources: {$ref: '#/components/schemas/WorkerResources'}
        tasks: {type: array, items: {$ref: '#/components/schemas/WorkerTask'}}
        hidden_tasks: {type: integer, description: Workflow in esecuzione di applicazioni/ambienti non leggibili}
    WorkerResources:
      type: object
      description: Ultimo campione delle risorse del worker, inviato a ogni heartbeat. I valori che il sistema operativo non fornisce mancano.
      required: [os, arch, cpus, cpu_limit, process_cpu_cores, goroutines, sampled_at]
      properties:
        os: {type: string}
        arch: {type: string}
        cpus: {type: integer, description: CPU logiche dell'host}
        cpu_limit: {type: integer, description: CPU utilizzabili dal processo (GOMAXPROCS, segue la quota del container)}
        memory_total_bytes: {type: integer, format: int64, description: Memoria dell'host}
        memory_available_bytes: {type: integer, format: int64, description: Memoria ancora disponibile sull'host}
        memory_limit_bytes: {type: integer, format: int64, description: Limite di memoria del container (cgroup)}
        process_memory_bytes: {type: integer, format: int64, description: Memoria residente del processo}
        process_cpu_cores: {type: number, description: CPU usata dal processo dal campione precedente, in core}
        load1: {type: number}
        load5: {type: number}
        load15: {type: number}
        goroutines: {type: integer}
        workdir_free_bytes: {type: integer, format: int64, description: Spazio libero del file system della workdir}
        concurrency: {type: integer, description: Deploy eseguiti insieme dal worker (dbos.concurrency)}
        sampled_at: {type: string, format: date-time}
    Queue:
      type: object
      required: [name, kind, enqueued, running, delayed, workers]
      properties:
        name: {type: string}
        kind: {type: string, enum: [deployments, approvals, region, other]}
        region: {type: string}
        worker_concurrency: {type: integer, description: Workflow eseguiti insieme da un worker (assente = nessun limite)}
        global_concurrency: {type: integer, description: Workflow eseguiti insieme su tutti i worker}
        partition_concurrency: {type: integer, description: Workflow eseguiti insieme per applicazione/ambiente}
        enqueued: {type: integer, format: int64, description: Workflow in attesa di uno slot}
        running: {type: integer, format: int64}
        delayed: {type: integer, format: int64, description: Workflow pianificati (schedule.at)}
        oldest_enqueued: {type: string, format: date-time, description: Creazione del workflow in attesa da più tempo}
        workers: {type: array, items: {type: string}, description: Worker attivi in ascolto sulla coda}
    WorkerTask:
      type: object
      required: [id, deployment_id, kind]
      properties:
        id: {type: string}
        deployment_id: {type: string}
        kind: {type: string, enum: [deploy, pass, gate, approval, schedule, after, release]}
        application: {type: string}
        environment: {type: string}
        region: {type: string}
        version: {type: string}
        queue: {type: string}
        started_at: {type: string, format: date-time}
        attempts: {type: integer}
    Activity:
      type: object
      required: [running, awaiting_approval, waiting_dependency, queued, delayed]
      properties:
        running: {type: array, items: {$ref: '#/components/schemas/Status'}}
        awaiting_approval: {type: array, items: {$ref: '#/components/schemas/Status'}}
        waiting_dependency: {type: array, items: {$ref: '#/components/schemas/Status'}}
        queued: {type: array, items: {$ref: '#/components/schemas/Status'}}
        delayed: {type: array, items: {$ref: '#/components/schemas/Status'}}
        truncated: {type: boolean}
    Validation:
      type: object
      required: [valid]
      properties:
        valid: {type: boolean}
        plan: {type: array, items: {$ref: '#/components/schemas/PlannedStep'}}
        rollback: {type: object, additionalProperties: true}
        deploy: {$ref: '#/components/schemas/DeployTargets'}
        secrets: {type: array, items: {type: string}}
        config: {type: object, additionalProperties: {type: string}}
        governance:
          type: object
          properties:
            revision: {type: string}
            rule: {type: string}
            requires: {type: array, items: {type: string}}
            approvals: {type: integer}
            approvers: {$ref: '#/components/schemas/Approvers'}
            change: {$ref: '#/components/schemas/ChangeRule'}
            freeze: {$ref: '#/components/schemas/WindowStatus'}
            deny: {type: array, items: {$ref: '#/components/schemas/Denial'}}
            notes: {type: array, items: {type: string}}
            error: {type: string}
        rollout: {$ref: '#/components/schemas/RolloutState'}
        warnings: {type: array, items: {type: string}}
    StepRecord:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        output: {}
        error: {type: string}
    LogLine:
      type: object
      required: [time, level, message]
      properties:
        time: {type: string, format: date-time}
        level: {type: string}
        step: {type: string}
        message: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
    LogPage:
      type: object
      required: [lines, next, done]
      properties:
        lines: {type: array, items: {$ref: '#/components/schemas/LogLine'}}
        next: {type: integer}
        done: {type: boolean}
    EnvironmentCheck:
      type: object
      required: [application, environment, config]
      properties:
        application: {type: string}
        environment: {type: string}
        config: {type: string, description: Configurazione di ambiente in YAML o JSON}
        descriptor: {$ref: '#/components/schemas/Descriptor'}
    InventoryEntry:
      type: object
      required: [application, environment]
      properties:
        application: {type: string}
        environment: {type: string}
        tenant: {type: string}
        current: {$ref: '#/components/schemas/Status'}
        last_failure: {$ref: '#/components/schemas/Status'}
        drift: {type: boolean}
        targets: {$ref: '#/components/schemas/TargetsState'}
        out_of_sync:
          type: boolean
          description: Almeno un target non è sulla versione di current (drifted o missing).
    TargetsState:
      type: object
      description: Stato letto dai target dall'ultima riconciliazione (reconcile.interval).
      required: [checked_at, deployment, version]
      properties:
        checked_at: {type: string, format: date-time}
        deployment: {type: string}
        version: {type: string}
        targets: {type: array, items: {$ref: '#/components/schemas/TargetState'}}
        error: {type: string}
    TargetState:
      type: object
      required: [host, state]
      properties:
        host: {type: string}
        region: {type: string}
        az: {type: string}
        slot: {type: string}
        version: {type: string}
        state: {type: string, enum: [in-sync, drifted, missing, standby, unknown]}
        detail: {type: string}
    WindowStatus:
      type: object
      required: [name, applications, environments, active]
      properties:
        name: {type: string}
        reason: {type: string}
        applications: {type: array, items: {type: string}}
        environments: {type: array, items: {type: string}}
        regions: {type: array, items: {type: string}}
        active: {type: boolean}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        recurring: {type: boolean}
        tenants: {type: string}
        hard: {type: boolean, description: Non esentabile dalla policy né superabile con freezeOverride}
        dynamic: {type: boolean, description: Creata a runtime}
        created_by: {type: string}
    TenantSkip:
      type: object
      required: [tenant, reason]
      properties:
        tenant: {type: string}
        reason: {type: string}
    TenantInfo:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        tags: {type: object, additionalProperties: {type: string}}
        applications: {type: object, additionalProperties: {type: array, items: {type: string}}}
        params: {type: object, additionalProperties: {type: object, additionalProperties: {type: string}}}
        secrets: {type: object, additionalProperties: {type: array, items: {type: string}}, description: Nomi dei segreti, mai i riferimenti}
        disabled: {type: boolean}
        source: {type: string}
    TenantRunEntry:
      type: object
      required: [tenant, group, state]
      properties:
        tenant: {type: string}
        group: {type: string}
        deployment_id: {type: string}
        state: {type: string, description: Stato del deploy, oppure PENDING_START, SKIPPED, DENIED}
        error: {type: string}
        reason: {type: string}
    TenantGroupState:
      type: object
      required: [name, state]
      properties:
        name: {type: string}
        bake: {type: string}
        state: {type: string, enum: [pending, running, baking, done, skipped]}
    TenantsRunState:
      type: object
      required: [id, application, environment, status, max_parallel, on_failure, groups, tenants]
      properties:
        id: {type: string}
        application: {type: string}
        environment: {type: string}
        artifact: {type: string}
        version: {type: string}
        kind: {type: string}
        status: {type: string, enum: [running, baking, paused-approval, succeeded, failed, stopped]}
        group: {type: string}
        paused: {type: string}
        max_parallel: {type: integer}
        on_failure: {type: string}
        groups: {type: array, items: {$ref: '#/components/schemas/TenantGroupState'}}
        tenants: {type: array, items: {$ref: '#/components/schemas/TenantRunEntry'}}
        approval: {$ref: '#/components/schemas/ApprovalState'}
        error: {type: string}
        updated_at: {type: string, format: date-time}
    FreezeRequest:
      type: object
      additionalProperties: false
      required: [name, applications, environments, to]
      properties:
        name: {type: string}
        reason: {type: string}
        applications: {type: array, items: {type: string}}
        environments: {type: array, items: {type: string}}
        regions: {type: array, items: {type: string}}
        tenants: {type: string, description: Selettore dei tenant}
        from: {type: string, format: date-time, description: Default adesso}
        to: {type: string, format: date-time}
        hard: {type: boolean}
    Approvers:
      type: object
      properties:
        groups: {type: array, items: {type: string}}
        subjects: {type: array, items: {type: string}}
    ChangeRule:
      type: object
      properties:
        approval: {type: boolean}
        timeout: {type: integer, description: Nanosecondi}
    Denial:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    PolicySnapshot:
      type: object
      required: [revision]
      properties:
        revision: {type: string}
        rule: {type: string}
        input_sha256: {type: string}
        notes: {type: array, items: {type: string}}
    PolicyTest:
      type: object
      required: [name, pass]
      properties:
        name: {type: string}
        pass: {type: boolean}
        error: {type: string}
    PolicyRevision:
      type: object
      required: [revision, sha256, status, author, created_at]
      properties:
        revision: {type: integer}
        sha256: {type: string}
        status: {type: string, enum: [draft, active, superseded]}
        author: {type: string}
        comment: {type: string}
        reviewed_by: {type: string}
        created_at: {type: string, format: date-time}
        activated_at: {type: string, format: date-time}
        tests: {type: array, items: {$ref: '#/components/schemas/PolicyTest'}}
        files: {type: object, additionalProperties: {type: string}}
    PolicyList:
      type: object
      required: [engine, current, revisions]
      properties:
        engine: {type: string, enum: [builtin, opa]}
        source: {type: string}
        current: {type: string, description: Revisione in vigore nel processo che ha risposto}
        loaded_at: {type: string, format: date-time}
        revisions: {type: array, items: {$ref: '#/components/schemas/PolicyRevision'}}
    PolicyPush:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files: {type: object, additionalProperties: {type: string}, description: Moduli *.rego e file data.json/data.yaml per percorso}
        comment: {type: string}
    PolicyEvaluationRequest:
      type: object
      additionalProperties: false
      required: [descriptor]
      properties:
        descriptor: {$ref: '#/components/schemas/Descriptor'}
        phase: {type: string, enum: [submit, validate, start, stage, tick]}
        kind: {type: string, enum: [deploy, promotion, rollback]}
    GovernanceDecision:
      type: object
      properties:
        revision: {type: string}
        rule: {type: string}
        deny: {type: array, items: {$ref: '#/components/schemas/Denial'}}
        requires: {type: array, items: {type: string}}
        approvals: {type: object, additionalProperties: true}
        change: {$ref: '#/components/schemas/ChangeRule'}
        freeze_exempt: {type: array, items: {type: string}}
        notes: {type: array, items: {type: string}}
        freeze: {$ref: '#/components/schemas/WindowStatus'}
        input_sha256: {type: string}
    PolicyEvaluation:
      type: object
      required: [input, decision]
      properties:
        input: {type: object, additionalProperties: true, description: Documento input della policy (schema 1)}
        decision: {$ref: '#/components/schemas/GovernanceDecision'}
    PolicyChange:
      type: object
      required: [deployment, application, environment, version, created_at, before, after]
      properties:
        deployment: {type: string}
        application: {type: string}
        environment: {type: string}
        version: {type: string}
        created_at: {type: string, format: date-time}
        before: {type: string}
        after: {type: string}
    PolicyImpact:
      type: object
      required: [revision, since, evaluated]
      properties:
        revision: {type: string}
        since: {type: string, format: date-time}
        evaluated: {type: integer}
        changes: {type: array, items: {$ref: '#/components/schemas/PolicyChange'}}
    ScheduleInfo:
      type: object
      required: [name, cron, status, application, environment]
      properties:
        name: {type: string}
        cron: {type: string}
        timezone: {type: string}
        status: {type: string}
        application: {type: string}
        environment: {type: string}
        requested_by: {type: string}
        last_fired_at: {type: string, format: date-time}
    DORAMetrics:
      type: object
      required: [deployments, failures, deployments_per_day, change_failure_rate]
      properties:
        application: {type: string}
        environment: {type: string}
        tenant: {type: string}
        deployments: {type: integer}
        failures: {type: integer}
        deployments_per_day: {type: number}
        change_failure_rate: {type: number}
        mttr_seconds: {type: number}
        lead_time_seconds: {type: number}
    DORAReport:
      type: object
      required: [since, until, total, environments]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        total: {$ref: '#/components/schemas/DORAMetrics'}
        environments: {type: array, items: {$ref: '#/components/schemas/DORAMetrics'}}
    Redeploy:
      type: object
      properties:
        id: {type: string}
        dry_run: {type: boolean}
        freeze_override: {type: string, description: Motivo della deroga al freeze}
    PromoteRequest:
      allOf:
        - $ref: '#/components/schemas/Redeploy'
        - type: object
          required: [application, from, to]
          properties:
            application: {type: string}
            from: {type: string}
            to: {type: string}
            version: {type: string}
            tenant: {type: string, description: Promuove la release di questo tenant}
            tenants: {type: string, description: Selettore dei tenant da promuovere, ognuno dalla propria release}
            deploy: {$ref: '#/components/schemas/DeployTargets'}
    RollbackRequest:
      allOf:
        - $ref: '#/components/schemas/Redeploy'
        - type: object
          required: [application, environment]
          properties:
            application: {type: string}
            environment: {type: string}
            version: {type: string}
            tenant: {type: string, description: Torna indietro sulla release di questo tenant}
            run: {type: string, description: Rilascio multi-tenant di cui riportare indietro i tenant riusciti}
    Grant:
      type: object
      required: [role, actions, applications, environments]
      properties:
        role: {type: string}
        actions: {type: array, items: {type: string}}
        applications: {type: array, items: {type: string}}
        environments: {type: array, items: {type: string}}
        tenants: {type: string, description: Selettore dei tenant a cui il permesso è limitato}
    Identity:
      type: object
      required: [subject, name, method, auth_enabled, grants]
      properties:
        subject: {type: string}
        name: {type: string}
        method: {type: string}
        groups: {type: array, items: {type: string}}
        auth_enabled: {type: boolean}
        grants: {type: array, items: {$ref: '#/components/schemas/Grant'}}
    UIConfig:
      type: object
      required: [auth_mode, version]
      properties:
        auth_mode: {type: string, enum: [none, oidc, unavailable]}
        issuer: {type: string}
        client_id: {type: string}
        scopes: {type: array, items: {type: string}}
        redirect_path: {type: string}
        version: {type: string}
