# Sample deploy descriptor (CLI: manent deploy -f examples/descriptor.yml)
apiVersion: manent/v1
# Optional: idempotency key. The same id never runs twice.
id: myapp-1.2.3-test
application: myapp
environment: test

artifact:
  type: application
  name: myapp
  version: 1.2.3
  source: ./dist/myapp-1.2.3.tar.gz   # local path, file:// or http(s)://
  # sha256: <expected hash, verified by the qa step>

secrets:
  - name: deploy-key
    ref: env:DEPLOY_SSH_KEY            # supported schemes: env:, file:
  - name: callback-key
    ref: env:MANENT_CALLBACK_KEY

deploy:
  policy: default
  plugin: remote-copy                  # optional: otherwise chosen by the policy per artifact type
  targets:
    - host: 192.168.1.10
      port: 22
      user: deploy
  params:
    dest_dir: /opt/myapp/releases
    ssh_key_secret: deploy-key
    post_command: "tar -xzf /opt/myapp/releases/myapp-1.2.3.tar.gz -C /opt/myapp/current"

# Callbacks (optional): they receive via POST the outcome of every step and of the deploy.
# Authentication refers to a secret of the secrets section, never to its value.
callbacks:
  - url: https://ci.example.com/hooks/manent
    auth:
      type: hmac                       # bearer | basic (with username) | header (with header) | hmac
      secret: callback-key
  - url: https://chat.example.com/hooks/deploy
    events: [deployment]               # step | deployment (default: all)

# Automatic rollback (optional): if allowed for the artifact type (rollback.artifact_types
# in manent.yml), on failure it brings the targets back to the previous release.
# With remote-copy it requires the releases layout: add to deploy.params
#   layout: releases                  # <dest_dir>/releases/<version> + symlink <dest_dir>/current
#   keep_releases: "5"
#   prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
#   post_command: "systemctl restart myapp"
# rollback:
#   enabled: true
#   on: [deploy, post-test]           # default: deploy, post-test, activation

# Dry-run (optional): simulates the deploy without changing the targets (same as "deploy --dry-run").
# dryRun: true

# Scheduling (optional). Without schedule the deploy starts at once.
# Single deploy at a time (e.g. maintenance window): it stays DELAYED in the DBOS queue until then.
# schedule:
#   at: 2026-10-10T02:00:00+02:00
# Recurring deploy: see examples/descriptor-scheduled.yml

# Enabling/disabling optional steps (mandatory ones cannot be disabled)
steps:
  qa: true
  post-test: true

postTest:
  http:
    - url: http://192.168.1.10:8080/health
      expectStatus: 200
