# UC24: uc24-shop of the tenant registry, on eu1-a.
plugin: remote-copy
targets:
  - {host: eu1-a, user: deploy, labels: {region: eu-1}}
params:
  dest_dir: /home/deploy/apps/uc24-shop
  layout: releases
  keep_releases: "3"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
secrets:
  - name: deploy-key
    ref: file:/keys/id
