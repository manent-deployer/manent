# manent configuration for the use cases (test/usecases): API and workers share this file;
# run.sh derives the region worker variants by adding dbos.region and dbos.region_routing.
# Short times (heartbeat, recovery, gate) so the scenarios last a few minutes.
app:
  name: manent
  version: 0.1.0

dbos:
  # The database comes from DBOS_SYSTEM_DATABASE_URL (compose.yml); the executor_id is the hostname.
  queue: deployments
  concurrency: 4
  environment_concurrency: 1
  schedule_poll_interval: 2s
  drain_timeout: 60s

recovery:
  heartbeat_interval: 2s
  stale_after: 6s
  auto_recover_after: 10s

rollout:
  check_timeout: 5s
  # UC15: real Prometheus; UC16: Datadog, New Relic, Elastic and CloudWatch emulated by fakes.
  prometheus_url: http://prometheus:9090
  datadog: {url: http://fakes:9100/datadog, api_key_ref: file:/keys/dd-api, app_key_ref: file:/keys/dd-app}
  newrelic: {url: http://fakes:9100/newrelic/graphql, account_id: 1234, api_key_ref: file:/keys/nr-key}
  elastic: {url: http://fakes:9100/elastic, api_key_ref: file:/keys/es-key}
  cloudwatch: {region: eu-west-1, endpoint: http://fakes:9100/cloudwatch, access_key_id_ref: file:/keys/aws-id, secret_access_key_ref: file:/keys/aws-secret}

# UC9: frequent reads of the state of awaited deploys.
chains:
  poll_interval: 1s

http:
  listen: ":8080"

logging:
  level: info
  format: text

workdir: /tmp/manent-work

envconfig:
  provider: file
  required: false
  file:
    path: /etc/manent/envconfig/{application}/{environment}.yml

# Only the lab sources: artifacts are in the shared volume /srv/artifacts, container images
# in the plain-text registry (UC6, UC7).
artifacts:
  allow_unlisted: false
  sources:
    - prefix: file:///srv/artifacts/
    - prefix: oci+http://registry:5000/uc/

rollback:
  locator: plugin
  artifact_types:
    application:
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    container:
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    kubernetes:
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]
    war:
      allowed: true
      enabled: false
      on: [deploy, post-test, activation]

# Test static tokens (uc-<name>-token): only the sha256 in the configuration.
auth:
  mode: enabled
  # Test identity provider (test/usecases/oidc) for the web interface (UC8): users ci, cab,
  # admin and viewer with the same groups as the static tokens.
  oidc:
    issuer: http://oidc:9000
    audience: manent
    username_claim: preferred_username
    groups_claim: groups
    ui:
      client_id: manent-ui
  tokens:
    - {name: ci, sha256: 31e75ebb1d5ad71fa4787f839f5a21751fbc7e26547e461ec36c3872ad11a969, groups: [ci]}
    - {name: cab, sha256: 747b88c3090b64b426e37f0d042f64d8f6d0eee1e997afa7d135045fae31489a, groups: [cab]}
    - {name: admin, sha256: ee6d41bedd050de5a3e01118d65033dd5b2a1d72c5c874c3b9b5d4257bb45301, groups: [admins]}
    - {name: viewer, sha256: b55ac51de6e0593e2f297b5c930d2ab09889ab8ddbe773841a36e281d7664c6e, groups: [viewers]}

rbac:
  bindings:
    - {groups: [ci], role: operator, applications: ["*"], environments: ["*"]}
    - {groups: [cab], role: approver, applications: ["*"], environments: ["*"]}
    - {groups: [admins], role: admin, applications: ["*"], environments: ["*"]}
    - {groups: [viewers], role: viewer, applications: ["*"], environments: ["*"]}

governance:
  rules:
    # UC2: in production only artifacts already released to test, with one approval.
    - name: uc2-produzione
      applications: [uc2-api]
      environments: [prod]
      requires: [test]
      approvals: {required: 1, timeout: 1h}
    # UC8: promotion to prod from the web interface asks for an approval.
    - name: uc8-produzione
      applications: [uc8-web]
      environments: [prod]
      approvals: {required: 1, timeout: 1h}
    # UC10: approvals moved into the percentage rollout (approvals.when: rollout): none before
    # the deploy, one at the 50% step; the first release asks it before any traffic.
    - name: uc10-blue-produzione
      applications: [uc10-blue]
      environments: [prod]
      approvals: {required: 1, timeout: 1h, when: rollout}
    # UC13: in production one approval (also from Slack) and the change approved in ServiceNow.
    - name: uc13-produzione
      applications: [uc13-api]
      environments: [prod]
      approvals: {required: 1, timeout: 1h}
      change: {approval: true, timeout: 1h}
    # Approvals between waves (UC4, UC5) need no rule: without one, a single approval is enough
    # and they expire after 72 hours. A rule with approvals would also impose an approval before
    # the deploy, unless approvals.when: rollout.
  freezes:
    - name: uc2-congelato
      reason: ambiente congelato per il caso d'uso
      applications: [uc2-api]
      environments: [frozen]
      from: 2020-01-01T00:00:00Z
      to: 2100-01-01T00:00:00Z
    - name: uc5-us-congelata
      reason: freeze della sola region us-1
      applications: [uc5-global]
      environments: [prod-us-freeze]
      regions: [us-1]
      from: 2020-01-01T00:00:00Z
      to: 2100-01-01T00:00:00Z

pipeline:
  # UC12: signed custom step specs; the lab endpoints are plain http.
  custom:
    spec_key_refs: ["file:/keys/spec-key"]
    allow_http: true
    insecure_ignore_host_key: true
  steps:
    - {name: secrets, mode: mandatory}
    - {name: artifacts, mode: mandatory, max_retries: 2}
    - {name: qa, mode: optional, enabled: true}
    # UC12: migration on one target over SSH, before the deploy (turned on by the descriptor).
    - name: uc12-migrate
      mode: optional
      enabled: false
      type: command
      max_retries: 1
      timeout: 2m
      secrets: [db-pass]
      ssh: {key_secret: deploy-key}
      params:
        database: {pattern: "[a-z][a-z0-9_]{0,30}", required: true}
      outputs:
        applied: {pattern: "[0-9]{1,6}"}
      run:
        run_once: true
        command: ["/home/deploy/bin/migrate", "up", "--to", "{{ .Version }}", "--db", "{{ .Params.database }}"]
      dry_run:
        run_once: true
        command: ["/home/deploy/bin/migrate", "plan", "--to", "{{ .Version }}", "--db", "{{ .Params.database }}"]
    - {name: deploy, mode: mandatory, max_retries: 1}
    - {name: post-test, mode: optional, enabled: false, max_retries: 1}
    - {name: activation, mode: optional, enabled: true}
    # UC12: notification to an external system that answers with a job to poll.
    - name: uc12-notify
      mode: optional
      enabled: false
      type: http
      max_retries: 1
      timeout: 1m
      secrets: [hook-token]
      params:
        hook: {pattern: "[a-z][a-z0-9-]{0,30}", required: true}
      outputs:
        ticket: {pattern: "TCK-[0-9]+", path: "$.ticket"}
      run:
        method: POST
        url: "http://fakes:9100/hooks/{{ .Params.hook }}"
        auth: {type: bearer, secret: hook-token}
        json:
          application: "{{ .Application }}"
          version: "{{ .Version }}"
          applied: '{{ index .Outputs "uc12-migrate" "applied" }}'
        poll:
          url: "http://fakes:9100/hooks/{{ .Params.hook }}/jobs/{{ .Response.job }}"
          interval: 1s
          until: {path: "$.status", in: [done]}

plugins:
  remote-copy:
    insecure_ignore_host_key: true   # lab: host keys regenerated at every start
    artifact_types: [application]
  container:
    insecure_ignore_host_key: true
    artifact_types: [container]
  kubernetes:
    artifact_types: [kubernetes]     # cluster CA from ca_secret (envconfig)
  jboss:
    artifact_types: [war]

# UC13: Slack, Teams and ServiceNow emulated by the fakes service (test/usecases/fakes).
integrations:
  public_url: http://127.0.0.1:18080
  language: it
  slack:
    api_url: http://fakes:9100/slack/api
    bot_token_ref: file:/keys/slack-token
    signing_secret_ref: file:/keys/slack-signing
    identities:
      U0CAB: {subject: "oidc:carla", groups: [cab]}
      U0CI: {subject: "token:ci", groups: [cab]}   # the requester: approver, but self-approval is refused
  notifications:
    - {name: uc13-slack, applications: [uc13-api], environments: ["*"], slack: {channel: C0UC13}}
    - {name: uc13-teams, applications: [uc13-api], environments: [prod], events: [approval], teams: {webhook_ref: file:/keys/teams-webhook}}
  change:
    provider: servicenow
    poll_interval: 2s
    servicenow:
      url: http://fakes:9100
      username: manent
      password_ref: file:/keys/snow-password
