# UC9: deploy chains. Every application on its own target, to check the order.
plugin: remote-copy
targets:
  - {host: eu1-a, user: deploy, labels: {region: eu-1}}
params:
  dest_dir: /home/deploy/apps/uc9-db
  layout: releases
  keep_releases: "5"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
  # Simulated faults: $HOME/fault/uc9-db.sleep (wait) and .fail (error).
  post_command: 'f=$HOME/fault/uc9-db; echo "$(date +%s) start $MANENT_VERSION" >> $f.log; if [ -f $f.sleep ]; then sleep $(cat $f.sleep); fi; echo "$(date +%s) end $MANENT_VERSION" >> $f.log; if [ -e $f.fail ]; then echo "guasto simulato su $(hostname)" >&2; exit 1; fi'
  rollback_command: "true"
secrets:
  - name: deploy-key
    ref: file:/keys/id
