# GitHub Action for manent: deploys from a workflow without writing API calls. It installs the
# manent client from this repository (same version as the action) if it is not on the PATH, and
# runs "manent deploy --ci": outputs in $GITHUB_OUTPUT, summary in $GITHUB_STEP_SUMMARY.
#
#   - uses: joeg-ita/manent/integrations/github@v0.1.0
#     with:
#       server: https://manent.example.com
#       token: ${{ secrets.MANENT_TOKEN }}
#       descriptor: deploy/prod.yml
#       version: ${{ github.ref_name }}
name: manent deploy
description: Releases an artifact with manent (deploy, validation of the descriptor or of the environment configuration)
author: manent
branding:
  icon: upload-cloud
  color: blue
inputs:
  server:
    description: URL of the manent server
    required: true
  token:
    description: API token (OIDC or static); use a secret
    required: true
  command:
    description: "deploy (default), validate (descriptor) or env-validate (candidate environment configuration)"
    default: deploy
  descriptor:
    description: YAML deploy descriptor (required for deploy and validate; for env-validate it is the optional example descriptor)
    default: ""
  version:
    description: Artifact version, instead of the descriptor's
    default: ""
  source:
    description: Artifact source, instead of the descriptor's
    default: ""
  sha256:
    description: Expected sha256 of the artifact
    default: ""
  id:
    description: Deploy ID (idempotency key), for example gh-${{ github.run_id }}
    default: ""
  dry-run:
    description: Simulates the deploy on a worker without changing the targets
    default: "false"
  wait:
    description: Waits for the deploy to end and fails if it does not succeed
    default: "true"
  timeout:
    description: Maximum wait time (e.g. 30m); the deploy goes on anyway
    default: 30m
  after:
    description: IDs of deploys that must succeed before this one, separated by spaces
    default: ""
  application:
    description: Application (env-validate)
    default: ""
  environment:
    description: Environment (env-validate)
    default: ""
  env-config:
    description: File of the candidate environment configuration (env-validate)
    default: ""
  ca-file:
    description: CA certificate of the server, if private
    default: ""
outputs:
  deployment-id:
    description: Deploy ID
    value: ${{ steps.run.outputs.deployment_id }}
  state:
    description: Final state (SUCCESS, ERROR, ...) or initial state without waiting
    value: ${{ steps.run.outputs.state }}
  version:
    description: Released version
    value: ${{ steps.run.outputs.version }}
runs:
  using: composite
  steps:
    - id: client
      shell: sh
      run: |
        if command -v manent >/dev/null 2>&1; then echo "install=false" >>"$GITHUB_OUTPUT"; else echo "install=true" >>"$GITHUB_OUTPUT"; fi
    - if: steps.client.outputs.install == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false
    - if: steps.client.outputs.install == 'true'
      shell: sh
      run: |
        # The client of the same version as the action: the action's checkout is the repository.
        cd "$GITHUB_ACTION_PATH/../.." && GOBIN="$RUNNER_TEMP/manent-bin" go install ./cmd/manent
        echo "$RUNNER_TEMP/manent-bin" >>"$GITHUB_PATH"
    - id: run
      shell: sh
      run: sh "$GITHUB_ACTION_PATH/run.sh"
      env:
        MANENT_SERVER: ${{ inputs.server }}
        MANENT_TOKEN: ${{ inputs.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DESCRIPTOR: ${{ inputs.descriptor }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_ID: ${{ inputs.id }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_AFTER: ${{ inputs.after }}
        INPUT_APPLICATION: ${{ inputs.application }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_ENV_CONFIG: ${{ inputs.env-config }}
        INPUT_CA_FILE: ${{ inputs.ca-file }}
