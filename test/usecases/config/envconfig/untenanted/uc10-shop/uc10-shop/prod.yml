# UC10: wave rollout one AZ at a time behind HAProxy: every batch leaves the uc10-shop backend
# (Data Plane API) before the deploy and comes back only once HAProxy sees it healthy.
# Use cases (test/usecases): targets, parameters and secrets of the environment.
plugin: remote-copy
targets:
  - {host: eu1-a, user: deploy, labels: {region: eu-1, az: eu-1a}}
  - {host: eu1-b, user: deploy, labels: {region: eu-1, az: eu-1b}}
  - {host: eu1-c, user: deploy, labels: {region: eu-1, az: eu-1c}}
params:
  dest_dir: /home/deploy/apps/uc10-shop
  layout: releases
  keep_releases: "3"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
  # Faults simulated by the use cases: $HOME/fault/uc10-shop.sleep (wait) and .fail (error).
  post_command: 'f=$HOME/fault/uc10-shop; echo "$(date +%s) start $MANENT_VERSION" >> $f.log; if [ -f $f.sleep ]; then sleep $(cat $f.sleep); fi; echo "$(date +%s) end $MANENT_VERSION" >> $f.log; if [ -e $f.fail ]; then echo "guasto simulato su $(hostname)" >&2; exit 1; fi'
  rollback_command: "true"
secrets:
  - {name: deploy-key, ref: file:/keys/id}
  - {name: dataplane, ref: file:/keys/dataplane}
rollback:
  enabled: true
rollout:
  waves:
    - {name: eu, select: "region=eu-1", by: az, bake: 1s}
  maxUnavailable: "1"
  onFailure: rollback-all
  health:
    interval: 1s
    probes:
      - {url: "http://{host}:8080/uc10-shop/current/healthz"}
traffic:
  pool:
    provider: haproxy
    min_healthy: "2"
    drain_timeout: 20s
    restore_timeout: 60s
    poll_interval: 1s
    settings:
      dataplane_urls: http://haproxy:5555
      backend: uc10-shop
      credentials_secret: dataplane
      allow_http: "true"
