# manent use case lab (test/usecases/run.sh): Postgres, API, workers, client and SSH/HTTP
# targets in two regions (eu-1 with three AZs, us-1 with two), on separate networks.
#
# - Default profile: API and two workers without a region, reaching all targets (UC1-UC4).
# - "regions" profile: an orchestrator and one worker per region with region_routing (UC5). Every
#   region worker sees only its targets' network, the orchestrator none: passes and health gate
#   probes run on the region workers.
# - "containers" profile: image registry and two VMs with Docker (UC6, container plugin).
# - "kubernetes" profile: registry and a k3s cluster (UC7, kubernetes plugin).
# - "lb" profile: HAProxy with the Data Plane API in front of the eu-1 targets (UC10).
# - "metrics" profile: Prometheus scraping HAProxy (UC15, canary analysis).
# - "jboss" profile: WildFly with the HTTP management API (UC14, jboss plugin).
# - "tools" profile: the manent client, run with "docker compose run --rm client ...".
#
# Files generated by run.sh in .work: binaries (bin), SSH key (keys), artifacts (artifacts),
# descriptors (uc), region worker configurations (config) and k3s credentials (k3s).
name: manent-uc

x-manent: &manent
  image: manent-uc:dev
  build:
    context: .work/bin
    dockerfile: ../../image/Dockerfile
  environment:
    DBOS_SYSTEM_DATABASE_URL: postgres://manent:manent@postgres:5432/manent?sslmode=disable
  depends_on:
    postgres:
      condition: service_healthy
  # The drain on shutdown waits for running deploys up to dbos.drain_timeout (60s).
  stop_grace_period: 75s

x-worker-volumes: &worker-volumes
  - ./config/manent.yml:/etc/manent/manent.yml:ro
  - ./config/envconfig:/etc/manent/envconfig:ro
  - ./.work/keys:/keys:ro
  - ./.work/artifacts:/srv/artifacts:ro
  - ./.work/k3s:/k3s:ro

x-target: &target
  image: manent-uc-target:dev
  build: target
  volumes:
    - ./.work/keys:/keys:ro

x-vm: &vm
  image: manent-uc-vm:dev
  build: vm
  profiles: [containers]
  privileged: true
  volumes:
    - ./.work/keys:/keys:ro
    - /var/lib/docker
  networks: [eu1]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manent
      POSTGRES_PASSWORD: manent
      POSTGRES_DB: manent
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "manent"]
      interval: 1s
      retries: 30
    networks: [core]

  # Test OIDC identity provider for the web interface (UC8).
  oidc:
    image: manent-uc:dev
    entrypoint: ["/usr/local/bin/manent-uc-oidc"]
    command: ["-listen", ":9000", "-issuer", "http://oidc:9000"]
    hostname: oidc
    networks: [core]

  # Fakes of Slack, Teams, ServiceNow and of a generic HTTP endpoint (UC12, UC13); the host
  # reads what manent sent on 127.0.0.1:19100/records.
  fakes:
    image: manent-uc:dev
    entrypoint: ["/usr/local/bin/manent-uc-fakes"]
    hostname: fakes
    ports: ["127.0.0.1:19100:9100"]
    networks: [core]

  api:
    <<: *manent
    command: ["api"]
    hostname: api
    depends_on:
      postgres:
        condition: service_healthy
      oidc:
        condition: service_started
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./config/manent.yml:/etc/manent/manent.yml:ro
      - ./config/envconfig:/etc/manent/envconfig:ro
      - ./.work/keys:/keys:ro
    networks: [core]

  worker-1:
    <<: *manent
    command: ["worker"]
    hostname: worker-1
    volumes: *worker-volumes
    networks: [core, eu1, us1]

  worker-2:
    <<: *manent
    command: ["worker"]
    hostname: worker-2
    volumes: *worker-volumes
    networks: [core, eu1, us1]

  orchestrator:
    <<: *manent
    profiles: [regions]
    command: ["worker"]
    hostname: orchestrator
    volumes:
      - ./.work/config/orchestrator.yml:/etc/manent/manent.yml:ro
      - ./config/envconfig:/etc/manent/envconfig:ro
      - ./.work/keys:/keys:ro
      - ./.work/artifacts:/srv/artifacts:ro
    networks: [core]

  worker-eu1:
    <<: *manent
    profiles: [regions]
    command: ["worker"]
    hostname: worker-eu1
    volumes:
      - ./.work/config/worker-eu1.yml:/etc/manent/manent.yml:ro
      - ./config/envconfig:/etc/manent/envconfig:ro
      - ./.work/keys:/keys:ro
      - ./.work/artifacts:/srv/artifacts:ro
    networks: [core, eu1]

  worker-us1:
    <<: *manent
    profiles: [regions]
    command: ["worker"]
    hostname: worker-us1
    volumes:
      - ./.work/config/worker-us1.yml:/etc/manent/manent.yml:ro
      - ./config/envconfig:/etc/manent/envconfig:ro
      - ./.work/keys:/keys:ro
      - ./.work/artifacts:/srv/artifacts:ro
    networks: [core, us1]

  client:
    image: manent-uc:dev
    profiles: [tools]
    entrypoint: ["/usr/local/bin/manent"]
    environment:
      MANENT_SERVER: http://api:8080
      MANENT_TOKEN: ${MANENT_TOKEN:-uc-ci-token}
    volumes:
      - ./.work/uc:/uc:ro
    networks: [core]

  eu1-a: {<<: *target, hostname: eu1-a, networks: [eu1]}
  eu1-b: {<<: *target, hostname: eu1-b, networks: [eu1]}
  eu1-c: {<<: *target, hostname: eu1-c, networks: [eu1]}
  us1-a: {<<: *target, hostname: us1-a, networks: [us1]}
  us1-b: {<<: *target, hostname: us1-b, networks: [us1]}

  # Image registry: workers resolve digests on core, VMs and k3s pull the images; run.sh pushes
  # the test images to it from the host (127.0.0.1:15000).
  registry:
    image: registry:2.8.3
    profiles: [containers, kubernetes]
    hostname: registry
    ports: ["127.0.0.1:15000:5000"]
    networks: [core, eu1]

  vm-a: {<<: *vm, hostname: vm-a}
  vm-b: {<<: *vm, hostname: vm-b}

  # HAProxy with the Data Plane API (UC10): pool drained per batch and router of the slots.
  # The host reaches the API on 127.0.0.1:15555 and the frontend on 127.0.0.1:18081.
  haproxy:
    image: manent-uc-haproxy:dev
    build: haproxy
    profiles: [lb]
    hostname: haproxy
    ports: ["127.0.0.1:15555:5555", "127.0.0.1:18081:80"]
    networks: [core, eu1]

  # Prometheus (UC15): API on 127.0.0.1:19090.
  prometheus:
    image: prom/prometheus:v2.53.2
    profiles: [metrics]
    hostname: prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1h"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:19090:9090"]
    networks: [core]

  # WildFly (UC14): management API on 127.0.0.1:19990, applications on 127.0.0.1:18082.
  wildfly:
    image: manent-uc-wildfly:dev
    build: wildfly
    profiles: [jboss]
    hostname: wildfly
    ports: ["127.0.0.1:19990:9990", "127.0.0.1:18082:8080"]
    networks: [core]

  # Single-node Kubernetes cluster. Static token for manent (.work/k3s/tokens.csv) and a
  # certificate also valid for the name "k3s".
  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    profiles: [kubernetes]
    hostname: k3s
    privileged: true
    command:
      - server
      - --disable=traefik,metrics-server,servicelb
      - --tls-san=k3s
      - --kube-apiserver-arg=token-auth-file=/k3s/tokens.csv
    tmpfs: [/run, /var/run]
    volumes:
      - ./.work/k3s:/k3s:ro
      - ./k3s/registries.yaml:/etc/rancher/k3s/registries.yaml:ro
    networks: [core]

networks:
  core: {}
  eu1: {}
  us1: {}
