# Sample composite release (CLI: manent release submit -f examples/release.yml).
# The database migration starts first; api and worker start in parallel once it has
# succeeded; web starts after api. The deploy files are relative to this file.
apiVersion: manent/v1
kind: Release
id: shop-2026-10
# stop (default): does not start the deploys not yet started if one fails.
# continue: goes on with the deploys that do not depend on the failed one.
# rollback: like stop, then brings the successful deploys back to the previous version.
onFailure: rollback
deploys:
  - name: db
    file: release/db.yml
  - name: api
    file: release/api.yml
    after: [db]
  - name: worker
    file: release/worker.yml
    after: [db]
  - name: web
    file: release/web.yml
    after: [api]
