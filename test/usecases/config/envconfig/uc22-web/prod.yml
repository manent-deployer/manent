# UC22: App Service web app with a staging slot on the emulated Azure: the package goes to the
# slot through Kudu (OneDeploy), the slot answers its health check, then the swap.
plugin: appservice
targets:
  - {host: uc22-web, labels: {region: westeurope}}
params:
  subscription: 33333333-0000-4000-8000-000000000022
  resource_group: uc22
  tenant_id: 22222222-0000-4000-8000-000000000022
  client_id: 22222222-0000-4000-8000-000000000022
  client_secret_secret: azure-sp
  slot: staging
  health_path: /healthz
  wait_timeout: 20s
secrets:
  - {name: azure-sp, ref: file:/keys/azure-secret}
