# UC4: wave rollout in one region by AZ, onFailure stop.
# Use cases (test/usecases): targets, parameters and secrets of the environment.
plugin: remote-copy
targets:
  - {host: eu1-a, user: deploy, labels: {region: eu-1, az: eu-1a}}
  - {host: eu1-b, user: deploy, labels: {region: eu-1, az: eu-1b}}
  - {host: eu1-c, user: deploy, labels: {region: eu-1, az: eu-1c}}
params:
  dest_dir: /home/deploy/apps/uc4-web-stop
  layout: releases
  keep_releases: "3"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
  # Faults simulated by the use cases: $HOME/fault/uc4-web.sleep (wait) and .fail (error).
  post_command: 'f=$HOME/fault/uc4-web; echo "$(date +%s) start $MANENT_VERSION" >> $f.log; if [ -f $f.sleep ]; then sleep $(cat $f.sleep); fi; echo "$(date +%s) end $MANENT_VERSION" >> $f.log; if [ -e $f.fail ]; then echo "guasto simulato su $(hostname)" >&2; exit 1; fi'
  rollback_command: "true"
secrets:
  - name: deploy-key
    ref: file:/keys/id
rollback:
  enabled: true
rollout:
  waves:
    - {name: canary, select: "az=eu-1a", bake: 3s}
    - {name: resto, select: "az!=eu-1a", by: az, bake: 3s}
  maxUnavailable: "1"
  onFailure: stop
  approvalsBetween: [canary]
  health:
    interval: 1s
    failuresToStop: 1
    probes:
      - {url: "http://{host}:8080/uc4-web-stop/current/healthz"}
