# UC19: one target, released from Terraform (manent provider).
plugin: remote-copy
targets:
  - {host: eu1-b, user: deploy, labels: {region: eu-1, az: eu-1b}}
params:
  dest_dir: /home/deploy/apps/uc19-shop
  layout: releases
  keep_releases: "3"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
  post_command: 'echo "$(date +%s) start $MANENT_VERSION" >> $HOME/fault/uc19-shop.log'
  rollback_command: "true"
secrets:
  - name: deploy-key
    ref: file:/keys/id
