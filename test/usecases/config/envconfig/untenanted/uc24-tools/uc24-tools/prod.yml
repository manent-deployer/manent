# UC24: an application no tenant lists: deployed as the tenant "untenanted", configuration
# under untenanted/.
plugin: remote-copy
targets:
  - {host: eu1-b, user: deploy, labels: {region: eu-1}}
params:
  dest_dir: /home/deploy/apps/uc24-tools
  layout: releases
  keep_releases: "3"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
secrets:
  - name: deploy-key
    ref: file:/keys/id
