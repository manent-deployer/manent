# manent documentation site: make docs (build into docs/site) or make docs-serve.
site_name: manent
site_description: Deploy as code on durable DBOS workflows
site_url: https://joeg-ita.github.io/manent/
repo_url: https://github.com/joeg-ita/manent
repo_name: joeg-ita/manent
edit_uri: edit/main/docs/content/
copyright: Distributed under the license in the repository's LICENSE file

docs_dir: content
site_dir: site
strict: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  # Dark by default; colors are in stylesheets/extra.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/joeg-ita/manent

plugins:
  - search:
      lang: [en, it]
  # English by default (page.md, at the root); Italian in page.it.md, served under /it/.
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: it
          name: Italiano
          build: true
          site_description: Deploy as code su workflow durevoli DBOS
          copyright: Distribuito con la licenza indicata nel file LICENSE del repository
          theme:
            palette:
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Tema chiaro
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Tema scuro
          nav_translations:
            Get started: Inizia
            Tutorials: Tutorial
            Quick start: Avvio rapido
            1. First deploy: 1. Primo deploy
            2. Environments and secrets: 2. Ambienti e segreti
            3. Promotion and approvals: 3. Promozione e approvazioni
            5. Progressive rollout: 5. Rilascio progressivo
            6. Deploy from CI: 6. Deploy dalla CI
            7. manent in production: 7. manent in produzione
            Concepts: Concetti
            Overview: Panoramica
            Architecture: Architettura
            Deploy types: Tipologie di deploy
            Deploy lifecycle: Ciclo di vita di un deploy
            Configuration model: Modello di configurazione
            Pipeline and steps: Pipeline e step
            Glossary: Glossario
            Guides: Guide
            Deploying: Rilasciare
            Environment configuration: Configurazione di ambiente
            Scheduled deploys: Deploy pianificati
            Deploy chains: Catene di deploy
            Tenants: Tenant
            Progressive delivery: Rilasci progressivi
            Wave rollouts: Rilasci a ondate
            Load balancer draining: Svuotamento dal load balancer
            Percentage rollouts: Rilasci per percentuale
            Release governance: Governance dei rilasci
            Policies in Rego: Policy in Rego
            Permissions as a policy: Permessi come policy
            Extending: Estendere
            Custom steps: Step personalizzati
            Callbacks: Callback
            Web interface: Interfaccia web
            Integrations: Integrazioni
            CI/CD and IaC: CI/CD e IaC
            Configuration and secrets: Configurazione e segreti
            Artifact repositories: Repository degli artefatti
            Identity: Identità
            OIDC identity providers: Identity provider OIDC
            Metrics and logs: Metriche e log
            Prometheus and Alertmanager: Prometheus e Alertmanager
            Metrics systems: Sistemi di metriche
            SIEM and syslog: SIEM e syslog
            Reference pages: Pagine di riferimento
            Chat and change management: Chat e change management
            CI and infrastructure as code: CI e infrastruttura come codice
            Plugins: Plugin
            Writing a plugin: Scrivere un plugin
            Servers and VMs: Server e VM
            Cloud services: Servizi cloud
            Application servers and Windows: Application server e Windows
            External plugins: Plugin esterni
            Operations: Operazioni
            Installation: Installazione
            Scalability: Scalabilità
            Recovery, shutdown and retention: Recovery, arresto e retention
            Versions and upgrades: Versioni e aggiornamenti
            Observability: Osservabilità
            Logs and SIEM: Log e SIEM
            Security: Sicurezza
            Authentication, permissions and audit: Autenticazione, permessi e audit
            Secrets and artifact sources: Segreti e sorgenti degli artefatti
            Reference: Riferimento
            Deploy descriptor: Descrittore di deploy
            CLI (manent client): CLI (client manent)
            HTTP API: API HTTP
            Configuring manent: Configurazione di manent
            Development: Sviluppo
            Contributing: Contribuire
            End-to-end use cases: Casi d'uso end-to-end
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

