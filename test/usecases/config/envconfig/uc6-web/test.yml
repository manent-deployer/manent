# UC6: container su una VM (vm-a), ambiente di test.
# Casi d'uso (test/usecases): target, parametri e segreti dell'ambiente.
plugin: container
targets:
  - {host: vm-a, user: deploy, labels: {region: eu-1, az: eu-1a}}
params:
  container_name: uc6-web-test
  run_args: "-p 8081:8080"
  ssh_key_secret: deploy-key
  wait_timeout: 40s
secrets:
  - name: deploy-key
    ref: file:/keys/id
