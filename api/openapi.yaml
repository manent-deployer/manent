openapi: 3.1.0
info:
  title: manent API
  version: v1
  description: |
    manent API: deploys, wave rollouts, governance, logs and metrics. Every route under /api/v1
    requires a bearer token (OIDC or static token) when authentication is enabled; permissions
    are those of RBAC per application and environment. Error responses have the form
    {"error": "<message>"}.

    This specification is the contract between server, web interface and client: a test compares
    the routes registered by the server with the paths below.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: deployments
  - name: governance
  - name: schedules
  - name: insight
  - name: access
  - name: platform
  - name: releases
  - name: policies
  - name: tenants
  - name: ui
  - name: probes

paths:
  /api/v1/deployments:
    post:
      tags: [deployments]
      summary: Enqueues a deploy, schedules it or creates a recurring schedule
      operationId: submitDeployment
      parameters:
        - name: dry_run
          in: query
          schema: {type: boolean}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Descriptor'}
      responses:
        '202': {description: Deploy enqueued, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '201': {description: Recurring schedule created or updated, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      tags: [deployments]
      summary: Lists the most recent deploys
      operationId: listDeployments
      parameters:
        - {name: schedule, in: query, schema: {type: string}}
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
        - {name: artifact, in: query, description: Artifact name (artifact.name), schema: {type: string}}
        - {name: selector, in: query, description: Selector on the applications (tag, application, tenant, tenant.<tag>), schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, default: 50}}
        - name: cursor
          in: query
          description: next_cursor of the previous page
          schema: {type: string}
      responses:
        '200':
          description: Deploys, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments: {type: array, items: {$ref: '#/components/schemas/Status'}}
                  next_cursor: {type: string, description: Present if the page is full}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/plan:
    post:
      tags: [deployments]
      summary: Computes the steps that would run
      operationId: planDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Descriptor'}
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: {type: array, items: {$ref: '#/components/schemas/PlannedStep'}}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/validate:
    post:
      tags: [deployments]
      summary: Checks the descriptor as at enqueueing, without enqueueing it
      operationId: validateDeployment
      parameters:
        - name: check_artifact
          in: query
          description: |
            Also checks from the API server that the artifact exists at its source, with the
            source credentials and without downloading it (HEAD for http(s), the manifest for an
            image, stat for a file). Requires the deployment.dry-run permission.
          schema: {type: boolean}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Descriptor'}
      responses:
        '200': {description: Effective deploy, content: {application/json: {schema: {$ref: '#/components/schemas/Validation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/environments/validate:
    post:
      tags: [deployments]
      summary: Checks a candidate environment configuration, before applying it
      description: |
        Merges the configuration (YAML or JSON, as in the configuration system) with the example
        descriptor (default: the request of the live deploy) and applies the enqueueing checks:
        unknown fields, descriptor policy, merge, rollback, wave and traffic plan. It enqueues and
        writes nothing.
      operationId: validateEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvironmentCheck'}
      responses:
        '200': {description: Effective deploy with the candidate configuration, content: {application/json: {schema: {$ref: '#/components/schemas/Validation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}:
    get:
      tags: [deployments]
      summary: State of a deploy
      operationId: getDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: State, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/steps:
    get:
      tags: [insight]
      summary: Recorded steps of the deploy
      operationId: getDeploymentSteps
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200':
          description: Step
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps: {type: array, items: {$ref: '#/components/schemas/StepRecord'}}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/logs:
    get:
      tags: [insight]
      summary: Log lines of the deploy starting from offset
      operationId: getDeploymentLogs
      parameters:
        - {$ref: '#/components/parameters/id'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Log page, content: {application/json: {schema: {$ref: '#/components/schemas/LogPage'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/events:
    get:
      tags: [insight]
      summary: State and log of the deploy as Server-Sent Events
      description: |
        Events "status" (Status in JSON, when it changes), "log" (array of LogLine; id = next
        offset, resumed with Last-Event-ID), "end" at the end, "error" if reading fails.
        ": keep-alive" comments every 15 seconds without events.
      operationId: streamDeploymentEvents
      parameters:
        - {$ref: '#/components/parameters/id'}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/cancel:
    post:
      tags: [deployments]
      summary: Cancels a waiting or running deploy
      operationId: cancelDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '204': {description: Cancelled}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/approve:
    post:
      tags: [governance]
      summary: Approves a deploy (before the deploy or between two waves)
      operationId: approveDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '204': {description: Decision recorded}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/reject:
    post:
      tags: [governance]
      summary: Rejects a deploy
      operationId: rejectDeployment
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '204': {description: Decision recorded}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/approvals:
    get:
      tags: [governance]
      summary: Waiting deploys the user can approve
      operationId: listApprovals
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals: {type: array, items: {$ref: '#/components/schemas/Status'}}
  /api/v1/promotions:
    post:
      tags: [governance]
      summary: Releases to an environment the artifact already released to another
      operationId: promote
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteRequest'}
      responses:
        '202': {description: Promotion enqueued, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/rollbacks:
    post:
      tags: [governance]
      summary: Releases a previous version again
      operationId: rollback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '202': {description: Rollback enqueued, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/inventory:
    get:
      tags: [governance]
      summary: Live releases by application and environment
      operationId: getInventory
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
        - {name: artifact, in: query, description: Artifact name (artifact.name), schema: {type: string}}
        - {name: selector, in: query, description: Selector on the applications (tag, application, tenant, tenant.<tag>), schema: {type: string}}
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                type: object
                required: [inventory]
                properties:
                  inventory: {type: array, items: {$ref: '#/components/schemas/InventoryEntry'}}
  /api/v1/freezes:
    get:
      tags: [governance]
      summary: Active and future freeze windows
      operationId: listFreezes
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
      responses:
        '200':
          description: Windows
          content:
            application/json:
              schema:
                type: object
                required: [freezes]
                properties:
                  freezes: {type: array, items: {$ref: '#/components/schemas/WindowStatus'}}
    post:
      tags: [governance]
      summary: Creates a freeze window at runtime (freeze.write)
      operationId: createFreeze
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FreezeRequest'}
      responses:
        '201': {description: Window created, content: {application/json: {schema: {$ref: '#/components/schemas/WindowStatus'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/freezes/{name}:
    delete:
      tags: [governance]
      summary: Deletes a freeze window created at runtime (freeze.write)
      operationId: deleteFreeze
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: Tenants of the registry, the teams that own the applications (filtered by permissions)
      operationId: listTenants
      parameters:
        - {name: application, in: query, description: Only the owner of this application, schema: {type: string}}
        - {name: selector, in: query, description: Selector on the tenant tags and name, schema: {type: string}}
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants: {type: array, items: {$ref: '#/components/schemas/TenantInfo'}}
  /api/v1/tenants/{name}:
    get:
      tags: [tenants]
      summary: A tenant
      operationId: getTenant
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '200': {description: Tenant, content: {application/json: {schema: {$ref: '#/components/schemas/TenantInfo'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/policies:
    get:
      tags: [policies]
      summary: Revisions of the governance policy (policy.read)
      operationId: listPolicies
      responses:
        '200': {description: Revisions and policy in force, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyList'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    post:
      tags: [policies]
      summary: Uploads a draft revision, after compilation and tests (policy.write)
      operationId: pushPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyPush'}
      responses:
        '201': {description: Draft revision, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRevision'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}:
    get:
      tags: [policies]
      summary: A revision with its files (policy.read)
      operationId: getPolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      responses:
        '200': {description: Revision, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRevision'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/evaluate:
    post:
      tags: [policies]
      summary: Decision of a revision on a descriptor (policy.write)
      operationId: evaluatePolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyEvaluationRequest'}
      responses:
        '200': {description: Input and decision, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyEvaluation'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/access:
    post:
      tags: [policies]
      summary: Permissions of a manually entered identity with a revision, comparison with the active one and outcome of an action (policy.write, rbac.engine opa)
      operationId: policyAccess
      parameters: [{$ref: '#/components/parameters/revision'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyAccessRequest'}
      responses:
        '200': {description: Simulated permissions, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyAccess'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/impact:
    get:
      tags: [policies]
      summary: Decisions of the period's real deploys recomputed with the revision (policy.write)
      operationId: policyImpact
      parameters:
        - {$ref: '#/components/parameters/revision'}
        - name: since
          in: query
          description: RFC 3339 date, duration (720h) or days (30d); default 7 days
          schema: {type: string}
      responses:
        '200': {description: Deploys with a different decision, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyImpact'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/approve:
    post:
      tags: [policies]
      summary: Approves and activates a draft revision (policy.approve, an identity other than the author)
      operationId: approvePolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      responses:
        '204': {description: Activated}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/policies/{revision}/activate:
    post:
      tags: [policies]
      summary: Goes back to a revision that was active in the past (policy.approve)
      operationId: activatePolicy
      parameters: [{$ref: '#/components/parameters/revision'}]
      responses:
        '204': {description: Activated}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/metrics/dora:
    get:
      tags: [insight]
      summary: DORA metrics
      operationId: getDORA
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
        - {name: artifact, in: query, schema: {type: string}}
        - {name: by, in: query, description: "tenant: metrics per tenant too", schema: {type: string, enum: [tenant]}}
        - name: since
          in: query
          description: RFC 3339 date, duration (720h) or days (30d); default 30 days
          schema: {type: string}
      responses:
        '200': {description: Metrics, content: {application/json: {schema: {$ref: '#/components/schemas/DORAReport'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/schedules:
    get:
      tags: [schedules]
      summary: Recurring schedules
      operationId: listSchedules
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: {type: array, items: {$ref: '#/components/schemas/ScheduleInfo'}}
  /api/v1/schedules/{name}:
    get:
      tags: [schedules]
      summary: A schedule
      operationId: getSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '200': {description: Schedule, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleInfo'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [schedules]
      summary: Deletes a schedule
      operationId: deleteSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/schedules/{name}/pause:
    post:
      tags: [schedules]
      summary: Pauses a schedule
      operationId: pauseSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Paused}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/schedules/{name}/resume:
    post:
      tags: [schedules]
      summary: Resumes a schedule
      operationId: resumeSchedule
      parameters: [{$ref: '#/components/parameters/name'}]
      responses:
        '204': {description: Resumed}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      tags: [access]
      summary: Identity of the request and the roles that apply to it
      operationId: getMe
      responses:
        '200': {description: Identity, content: {application/json: {schema: {$ref: '#/components/schemas/Identity'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/workers:
    get:
      tags: [platform]
      summary: Registered workers with state, heartbeat and running workflows (platform.read permission)
      operationId: listWorkers
      responses:
        '200':
          description: Worker
          content:
            application/json:
              schema:
                type: object
                required: [workers]
                properties:
                  workers: {type: array, items: {$ref: '#/components/schemas/Worker'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/queues:
    get:
      tags: [platform]
      summary: manent's DBOS queues with limits, queued, running and scheduled workflows and listening workers (platform.read permission)
      operationId: listQueues
      responses:
        '200':
          description: Queues
          content:
            application/json:
              schema:
                type: object
                required: [queues]
                properties:
                  queues: {type: array, items: {$ref: '#/components/schemas/Queue'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/activity:
    get:
      tags: [platform]
      summary: Unfinished deploys (running, awaiting approval, queued, scheduled)
      operationId: getActivity
      parameters:
        - {name: application, in: query, schema: {type: string}}
        - {name: environment, in: query, schema: {type: string}}
        - {name: tenant, in: query, schema: {type: string}}
      responses:
        '200': {description: Activity, content: {application/json: {schema: {$ref: '#/components/schemas/Activity'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/releases:
    post:
      tags: [releases]
      summary: Enqueues a composite release (several deploys with dependencies)
      operationId: submitRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Release'}
      responses:
        '202': {description: Release enqueued, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseStatus'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    get:
      tags: [releases]
      summary: Most recent releases
      operationId: listReleases
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases: {type: array, items: {$ref: '#/components/schemas/ReleaseStatus'}}
  /api/v1/releases/{id}:
    get:
      tags: [releases]
      summary: State of a release and its deploys
      operationId: getRelease
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Release, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseStatus'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/releases/{id}/cancel:
    post:
      tags: [releases]
      summary: Cancels the unfinished deploys of the release and the release
      operationId: cancelRelease
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '204': {description: Cancelled}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /ui/config.json:
    get:
      tags: [ui]
      summary: Public configuration of the web interface
      operationId: getUIConfig
      security: []
      responses:
        '200': {description: Configuration, content: {application/json: {schema: {$ref: '#/components/schemas/UIConfig'}}}}
  /integrations/slack/interactions:
    post:
      tags: [integrations]
      summary: Clicks on the approval buttons of Slack messages (the app's Interactivity Request URL)
      description: >-
        Authenticated by the Slack signature (X-Slack-Signature, X-Slack-Request-Timestamp), not by a bearer.
        The decision is recorded with the manent identity linked to the Slack user; the outcome reaches
        the user as an ephemeral message.
      operationId: slackInteractions
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: {type: string, description: JSON payload of the interaction (block_actions)}
      responses:
        '200': {description: Received}
        '401': {description: Invalid signature or expired request}
        '503': {description: Integration not available}
  /healthz:
    get:
      tags: [probes]
      summary: The process responds
      operationId: healthz
      security: []
      responses:
        '200': {description: OK}
  /readyz:
    get:
      tags: [probes]
      summary: The process is ready (database reachable, not draining)
      operationId: readyz
      security: []
      responses:
        '200': {description: Ready}
        '503': {description: Not ready}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string}
    name:
      name: name
      in: path
      required: true
      schema: {type: string}
    revision:
      name: revision
      in: path
      required: true
      description: Revision number, or current for the one in force
      schema: {type: string}
  requestBodies:
    Decision:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              comment: {type: string}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Descriptor:
      type: object
      description: Deploy descriptor (see the "Descriptor" guide in the documentation).
      additionalProperties: true
      required: [apiVersion, application, environment, artifact]
      properties:
        apiVersion: {type: string, examples: [manent/v1]}
        id: {type: string}
        tenant: {type: string, description: "Tenant of the application: chooses among the tenants that list it, required only if more than one; untenanted for applications without a tenant"}
        application: {type: string}
        environment: {type: string}
        dryRun: {type: boolean}
        after: {type: array, items: {type: string}, description: IDs of the deploys that must succeed before this one}
        afterTimeout: {type: string, description: Maximum wait for the dependencies (default 24h)}
        config:
          type: object
          description: Revision of the environment configuration (git provider), within descriptor_policy.config_ref
          properties:
            ref: {type: string, description: Name of a ref (refs/tags/env-1) or SHA of a commit}
        imports:
          type: object
          description: Deploys whose exports are read at start (deploy.targetsFrom, deploy.paramsFrom)
          additionalProperties: {$ref: '#/components/schemas/Import'}
        exports:
          type: object
          description: Deploy outputs that other deploys can import
          additionalProperties: {$ref: '#/components/schemas/Export'}
        artifact:
          type: object
          required: [type, name, source]
          properties:
            type: {type: string}
            name: {type: string}
            version: {type: string}
            source: {type: string}
            sha256: {type: string}
    Import:
      type: object
      description: A given deploy (deployment, among the after dependencies) or the live release of an application (current)
      properties:
        deployment: {type: string}
        current:
          type: object
          required: [application]
          properties:
            tenant: {type: string}
            application: {type: string}
            environment: {type: string, description: Default the environment of the importing deploy}
            artifact: {type: string, description: "Artifact of the application; required if the environment has more than one"}
    Export:
      type: object
      required: [from]
      properties:
        from: {type: string, description: '"<step>.<key>": output of the plugin (deploy step) or of a custom step'}
        format: {type: string, enum: [string, targets]}
        pattern: {type: string, description: Anchored regular expression (required with format string)}
    DeployTargets:
      type: object
      description: Deploy section of a descriptor (plugin, targets, parameters).
      additionalProperties: true
    PlannedStep:
      type: object
      additionalProperties: true
      properties:
        name: {type: string}
        max_retries: {type: integer}
        type:
          type: string
          description: Kind of the custom step (command, http); absent for the standard steps.
        spec_hash:
          type: string
          description: Sha256 of the custom step's specification, as in pipeline.custom.revoked_specs. Commands and URLs are not exposed.
    Submission:
      type: object
      required: [state]
      properties:
        id: {type: string}
        state: {type: string}
        scheduled_at: {type: string, format: date-time}
        schedule: {type: string}
        dry_run: {type: boolean}
    Decision:
      type: object
      required: [approver, approve, time]
      properties:
        approver: {type: string}
        approve: {type: boolean}
        comment: {type: string}
        time: {type: string, format: date-time}
    ApprovalState:
      type: object
      required: [status, required, expires_at]
      properties:
        status: {type: string, enum: [pending, approved, rejected, expired]}
        required: {type: integer}
        allow_self: {type: boolean}
        approvers: {$ref: '#/components/schemas/Approvers'}
        expires_at: {type: string, format: date-time}
        decisions: {type: array, items: {$ref: '#/components/schemas/Decision'}}
        change: {$ref: '#/components/schemas/ChangeTicket'}
    ChangeTicket:
      type: object
      description: Change management ticket (ServiceNow, Jira) of the deploy
      required: [number]
      properties:
        id: {type: string, description: Technical identifier in the ITSM system}
        number: {type: string, description: Readable reference, e.g. CHG0031337}
        url: {type: string}
        approval: {type: string, enum: [pending, approved, rejected]}
    RolloutPass:
      type: object
      required: [name, hosts]
      properties:
        name: {type: string}
        region: {type: string}
        az: {type: string}
        hosts: {type: array, items: {type: string}}
        drained: {type: array, items: {type: string}, description: Pool members out of the load balancer right now}
    RolloutStage:
      type: object
      required: [name, wave, state, passes]
      properties:
        name: {type: string}
        wave: {type: string}
        state: {type: string, enum: [pending, running, baking, succeeded, failed, rolled-back]}
        passes: {type: array, items: {$ref: '#/components/schemas/RolloutPass'}}
        gate: {type: string, description: Last red check of the health gate}
        score: {type: number, description: Canary analysis score (0-100) at the last gate reading}
        error: {type: string}
    RolloutState:
      type: object
      required: [status, stages, on_failure]
      properties:
        strategy: {type: string, enum: [waves, traffic], description: Empty for wave rollouts}
        status: {type: string, enum: [planned, running, paused-approval, paused-freeze, paused-drift, succeeded, failed]}
        stage: {type: string}
        paused: {type: string}
        stages: {type: array, items: {$ref: '#/components/schemas/RolloutStage'}}
        approval: {$ref: '#/components/schemas/ApprovalState'}
        on_failure: {type: string}
        rollback: {type: string}
        traffic: {$ref: '#/components/schemas/TrafficState'}
    TrafficState:
      type: object
      description: Percentage rollout (strategy traffic); the stages are the steps
      required: [weight, steps]
      properties:
        pass: {type: string, description: Pass in progress in wave rollouts}
        router: {type: string}
        stable: {type: string, description: Slot of the stable version}
        candidate: {type: string, description: Slot of the candidate version}
        weight: {type: integer, description: Current traffic share of the candidate}
        steps: {type: array, items: {type: integer}}
        testers: {type: boolean}
        promoted: {type: boolean}
    StepResult:
      type: object
      required: [name]
      properties:
        name: {type: string}
        output: {type: object, additionalProperties: {type: string}}
    Result:
      type: object
      required: [deployment_id, steps]
      properties:
        deployment_id: {type: string}
        dry_run: {type: boolean}
        steps: {type: array, items: {$ref: '#/components/schemas/StepResult'}}
        rollout: {$ref: '#/components/schemas/RolloutState'}
        change: {$ref: '#/components/schemas/ChangeTicket'}
        exports: {type: object, additionalProperties: {type: string}, description: Exports of the successful deploy}
    Status:
      type: object
      required: [id, state, created_at, updated_at]
      properties:
        id: {type: string}
        state:
          type: string
          description: ENQUEUED, DELAYED, PENDING, SUCCESS, ERROR, CANCELLED, AWAITING_APPROVAL, REJECTED, EXPIRED, WAITING_DEPENDENCY, DEPENDENCY_FAILED, MAX_RECOVERY_ATTEMPTS_EXCEEDED
        application: {type: string}
        environment: {type: string}
        tenant: {type: string}
        artifact: {type: string}
        version: {type: string}
        sha256: {type: string}
        config_revision: {type: string, description: Commit SHA of the environment configuration (git provider)}
        kind: {type: string, enum: [deploy, promotion, rollback]}
        source: {type: string, description: Source deploy of a promotion or a rollback}
        dry_run: {type: boolean}
        rollback: {type: string, description: Outcome of the automatic rollback}
        requested_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        scheduled_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, description: Start of the execution on the worker}
        executor: {type: string, description: Worker that runs or ran the deploy}
        queue: {type: string}
        last_step: {type: string, description: Last recorded step of a running deploy (only in /activity)}
        approval: {$ref: '#/components/schemas/ApprovalState'}
        change: {$ref: '#/components/schemas/ChangeTicket'}
        after: {$ref: '#/components/schemas/AfterState'}
        release: {type: string, description: Composite release the deploy belongs to}
        policy: {$ref: '#/components/schemas/PolicySnapshot'}
        rollout: {$ref: '#/components/schemas/RolloutState'}
        rollout_progress: {type: string, description: '"stadi superati/stadi totali"'}
        exports: {type: object, additionalProperties: {type: string}, description: Exports of the successful deploy, importable by other deploys}
        result: {$ref: '#/components/schemas/Result'}
        error: {type: string}
    AfterState:
      type: object
      required: [status, expires_at, dependencies]
      properties:
        status: {type: string, enum: [waiting, satisfied, failed, expired]}
        expires_at: {type: string, format: date-time}
        dependencies:
          type: array
          items:
            type: object
            required: [id, state]
            properties:
              id: {type: string}
              state: {type: string}
        reason: {type: string}
    Release:
      type: object
      required: [apiVersion, kind, id, deploys]
      properties:
        apiVersion: {type: string, examples: [manent/v1]}
        kind: {type: string, enum: [Release]}
        id: {type: string}
        onFailure: {type: string, enum: [stop, continue, rollback]}
        deploys:
          type: array
          items:
            type: object
            required: [name, descriptor]
            properties:
              name: {type: string}
              descriptor: {$ref: '#/components/schemas/Descriptor'}
              after: {type: array, items: {type: string}, description: Names of other deploys of the release}
    ReleaseStatus:
      type: object
      required: [id, state, on_failure, created_at, updated_at, deploys]
      properties:
        id: {type: string}
        state: {type: string, description: PENDING, SUCCESS, ERROR, CANCELLED}
        on_failure: {type: string, enum: [stop, continue, rollback]}
        requested_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        error: {type: string}
        deploys:
          type: array
          items:
            type: object
            required: [name, deployment_id, application, environment, state]
            properties:
              name: {type: string}
              deployment_id: {type: string}
              tenant: {type: string}
              application: {type: string}
              artifact: {type: string}
              environment: {type: string}
              version: {type: string}
              after: {type: array, items: {type: string}}
              state: {type: string}
              error: {type: string}
              rollback_id: {type: string}
              rollback_state: {type: string}
    Worker:
      type: object
      required: [id, state, tasks]
      properties:
        id: {type: string, description: DBOS executor ID}
        state: {type: string, enum: [alive, stale, stopped, unregistered]}
        version: {type: string, description: Workflow version (app.version)}
        build: {type: string, description: Binary version}
        hostname: {type: string}
        region: {type: string}
        started_at: {type: string, format: date-time}
        heartbeat_at: {type: string, format: date-time}
        stopped_at: {type: string, format: date-time}
        recovered_by: {type: string}
        recovered_at: {type: string, format: date-time}
        pending: {type: object, additionalProperties: {type: integer}, description: Pending workflows by workflow version}
        queues: {type: array, items: {type: string}, description: DBOS queues the worker dequeues from}
        resources: {$ref: '#/components/schemas/WorkerResources'}
        tasks: {type: array, items: {$ref: '#/components/schemas/WorkerTask'}}
        hidden_tasks: {type: integer, description: Running workflows of applications/environments not readable}
    WorkerResources:
      type: object
      description: Last sample of the worker's resources, sent at every heartbeat. Values the operating system does not provide are missing.
      required: [os, arch, cpus, cpu_limit, process_cpu_cores, goroutines, sampled_at]
      properties:
        os: {type: string}
        arch: {type: string}
        cpus: {type: integer, description: Logical CPUs of the host}
        cpu_limit: {type: integer, description: CPUs usable by the process (GOMAXPROCS, follows the container quota)}
        memory_total_bytes: {type: integer, format: int64, description: Memory of the host}
        memory_available_bytes: {type: integer, format: int64, description: Memory still available on the host}
        memory_limit_bytes: {type: integer, format: int64, description: Memory limit of the container (cgroup)}
        process_memory_bytes: {type: integer, format: int64, description: Resident memory of the process}
        process_cpu_cores: {type: number, description: CPU used by the process since the previous sample, in cores}
        load1: {type: number}
        load5: {type: number}
        load15: {type: number}
        goroutines: {type: integer}
        workdir_free_bytes: {type: integer, format: int64, description: Free space on the workdir file system}
        concurrency: {type: integer, description: Deploys run together by the worker (dbos.concurrency)}
        sampled_at: {type: string, format: date-time}
    Queue:
      type: object
      required: [name, kind, enqueued, running, delayed, workers]
      properties:
        name: {type: string}
        kind: {type: string, enum: [deployments, approvals, region, plugin, other]}
        region: {type: string}
        worker_concurrency: {type: integer, description: Workflows run together by one worker (absent = no limit)}
        global_concurrency: {type: integer, description: Workflows run together across all workers}
        partition_concurrency: {type: integer, description: Workflows run together per application/environment}
        enqueued: {type: integer, format: int64, description: Workflows waiting for a slot}
        running: {type: integer, format: int64}
        delayed: {type: integer, format: int64, description: Scheduled workflows (schedule.at)}
        oldest_enqueued: {type: string, format: date-time, description: Creation of the workflow waiting the longest}
        workers: {type: array, items: {type: string}, description: Active workers listening on the queue}
    WorkerTask:
      type: object
      required: [id, deployment_id, kind]
      properties:
        id: {type: string}
        deployment_id: {type: string}
        kind: {type: string, enum: [deploy, pass, gate, approval, schedule, after, release]}
        tenant: {type: string}
        application: {type: string}
        environment: {type: string}
        region: {type: string}
        version: {type: string}
        queue: {type: string}
        started_at: {type: string, format: date-time}
        attempts: {type: integer}
    Activity:
      type: object
      required: [running, awaiting_approval, waiting_dependency, queued, delayed]
      properties:
        running: {type: array, items: {$ref: '#/components/schemas/Status'}}
        awaiting_approval: {type: array, items: {$ref: '#/components/schemas/Status'}}
        waiting_dependency: {type: array, items: {$ref: '#/components/schemas/Status'}}
        queued: {type: array, items: {$ref: '#/components/schemas/Status'}}
        delayed: {type: array, items: {$ref: '#/components/schemas/Status'}}
        truncated: {type: boolean}
    Validation:
      type: object
      required: [valid]
      properties:
        valid: {type: boolean}
        plan: {type: array, items: {$ref: '#/components/schemas/PlannedStep'}}
        rollback: {type: object, additionalProperties: true}
        deploy: {$ref: '#/components/schemas/DeployTargets'}
        secrets: {type: array, items: {type: string}}
        config: {type: object, additionalProperties: {type: string}}
        governance:
          type: object
          properties:
            revision: {type: string}
            rule: {type: string}
            requires: {type: array, items: {type: string}}
            approvals: {type: integer}
            approvers: {$ref: '#/components/schemas/Approvers'}
            change: {$ref: '#/components/schemas/ChangeRule'}
            freeze: {$ref: '#/components/schemas/WindowStatus'}
            deny: {type: array, items: {$ref: '#/components/schemas/Denial'}}
            notes: {type: array, items: {type: string}}
            error: {type: string}
        rollout: {$ref: '#/components/schemas/RolloutState'}
        artifact:
          type: object
          description: Outcome of the artifact check (check_artifact)
          required: [source, sha256_verified]
          properties:
            source: {type: string}
            sha256: {type: string, description: Digest read from the source, only for registry images}
            size: {type: integer, format: int64}
            sha256_verified: {type: boolean, description: Whether artifact.sha256 was compared with the source}
        warnings: {type: array, items: {type: string}}
    StepRecord:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        output: {}
        error: {type: string}
    LogLine:
      type: object
      required: [time, level, message]
      properties:
        time: {type: string, format: date-time}
        level: {type: string}
        step: {type: string}
        message: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
    LogPage:
      type: object
      required: [lines, next, done]
      properties:
        lines: {type: array, items: {$ref: '#/components/schemas/LogLine'}}
        next: {type: integer}
        done: {type: boolean}
    EnvironmentCheck:
      type: object
      required: [application, environment, config]
      properties:
        tenant: {type: string}
        application: {type: string}
        artifact: {type: string, description: "Artifact the configuration refers to (template with {artifact})"}
        environment: {type: string}
        config: {type: string, description: Environment configuration in YAML or JSON}
        descriptor: {$ref: '#/components/schemas/Descriptor'}
    InventoryEntry:
      type: object
      required: [application, artifact, environment]
      properties:
        application: {type: string}
        artifact: {type: string, description: "Artifact (artifact.name) of the entry"}
        environment: {type: string}
        tenant: {type: string}
        current: {$ref: '#/components/schemas/Status'}
        last_failure: {$ref: '#/components/schemas/Status'}
        drift: {type: boolean}
        targets: {$ref: '#/components/schemas/TargetsState'}
        out_of_sync:
          type: boolean
          description: At least one target is not on the version of current (drifted or missing).
    TargetsState:
      type: object
      description: State read from the targets by the last reconciliation (reconcile.interval).
      required: [checked_at, deployment, version]
      properties:
        checked_at: {type: string, format: date-time}
        deployment: {type: string}
        version: {type: string}
        targets: {type: array, items: {$ref: '#/components/schemas/TargetState'}}
        error: {type: string}
    TargetState:
      type: object
      required: [host, state]
      properties:
        host: {type: string}
        region: {type: string}
        az: {type: string}
        slot: {type: string}
        version: {type: string}
        state: {type: string, enum: [in-sync, drifted, missing, standby, unknown]}
        detail: {type: string}
    WindowStatus:
      type: object
      required: [name, applications, environments, active]
      properties:
        name: {type: string}
        reason: {type: string}
        applications: {type: array, items: {type: string}}
        environments: {type: array, items: {type: string}}
        regions: {type: array, items: {type: string}}
        active: {type: boolean}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        recurring: {type: boolean}
        tenants: {type: string}
        artifacts: {type: array, items: {type: string}}
        selector: {type: string}
        hard: {type: boolean, description: Cannot be exempted by the policy nor bypassed with freezeOverride}
        dynamic: {type: boolean, description: Created at runtime}
        created_by: {type: string}
    TenantInfo:
      type: object
      required: [name]
      description: A tenant, the team that owns the applications
      properties:
        name: {type: string}
        description: {type: string}
        tags: {type: object, additionalProperties: {type: string}}
        applications:
          type: object
          description: Owned applications, with their tags
          additionalProperties:
            type: object
            properties:
              tags: {type: object, additionalProperties: {type: string}}
        queue: {type: string, description: Deploy queue of the tenant; absent for the default queue}
        concurrency: {type: integer}
        disabled: {type: boolean}
        source: {type: string}
        revision: {type: string}
    FreezeRequest:
      type: object
      additionalProperties: false
      required: [name, applications, environments, to]
      properties:
        name: {type: string}
        reason: {type: string}
        applications: {type: array, items: {type: string}}
        environments: {type: array, items: {type: string}}
        regions: {type: array, items: {type: string}}
        tenants: {type: string, description: Tenant selector}
        artifacts: {type: array, items: {type: string}, description: Patterns on the artifact names}
        selector: {type: string, description: Selector on the applications (tag, application, tenant, tenant.<tag>)}
        from: {type: string, format: date-time, description: Default now}
        to: {type: string, format: date-time}
        hard: {type: boolean}
    Approvers:
      type: object
      properties:
        groups: {type: array, items: {type: string}}
        subjects: {type: array, items: {type: string}}
    ChangeRule:
      type: object
      properties:
        approval: {type: boolean}
        timeout: {type: integer, description: Nanoseconds}
    Denial:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    PolicySnapshot:
      type: object
      required: [revision]
      properties:
        revision: {type: string}
        rule: {type: string}
        input_sha256: {type: string}
        notes: {type: array, items: {type: string}}
    PolicyTest:
      type: object
      required: [name, pass]
      properties:
        name: {type: string}
        pass: {type: boolean}
        error: {type: string}
    PolicyRevision:
      type: object
      required: [revision, sha256, status, author, created_at]
      properties:
        revision: {type: integer}
        sha256: {type: string}
        status: {type: string, enum: [draft, active, superseded]}
        author: {type: string}
        comment: {type: string}
        reviewed_by: {type: string}
        created_at: {type: string, format: date-time}
        activated_at: {type: string, format: date-time}
        tests: {type: array, items: {$ref: '#/components/schemas/PolicyTest'}}
        files: {type: object, additionalProperties: {type: string}}
    PolicyList:
      type: object
      required: [engine, current, revisions]
      properties:
        engine: {type: string, enum: [builtin, opa]}
        source: {type: string}
        current: {type: string, description: Revision in force in the process that responded}
        loaded_at: {type: string, format: date-time}
        revisions: {type: array, items: {$ref: '#/components/schemas/PolicyRevision'}}
    PolicyPush:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files: {type: object, additionalProperties: {type: string}, description: Rego modules (*.rego) and data.json/data.yaml files by path}
        comment: {type: string}
    PolicyEvaluationRequest:
      type: object
      additionalProperties: false
      required: [descriptor]
      properties:
        descriptor: {$ref: '#/components/schemas/Descriptor'}
        phase: {type: string, enum: [submit, validate, start, stage, tick]}
        kind: {type: string, enum: [deploy, promotion, rollback]}
    GovernanceDecision:
      type: object
      properties:
        revision: {type: string}
        rule: {type: string}
        deny: {type: array, items: {$ref: '#/components/schemas/Denial'}}
        requires: {type: array, items: {type: string}}
        approvals: {type: object, additionalProperties: true}
        change: {$ref: '#/components/schemas/ChangeRule'}
        freeze_exempt: {type: array, items: {type: string}}
        notes: {type: array, items: {type: string}}
        freeze: {$ref: '#/components/schemas/WindowStatus'}
        input_sha256: {type: string}
    PolicyEvaluation:
      type: object
      required: [input, decision]
      properties:
        input: {type: object, additionalProperties: true, description: Policy input document (schema 1)}
        decision: {$ref: '#/components/schemas/GovernanceDecision'}
    PolicyChange:
      type: object
      required: [deployment, application, environment, version, created_at, before, after]
      properties:
        deployment: {type: string}
        tenant: {type: string}
        application: {type: string}
        environment: {type: string}
        version: {type: string}
        created_at: {type: string, format: date-time}
        before: {type: string}
        after: {type: string}
    PolicyImpact:
      type: object
      required: [revision, since, evaluated]
      properties:
        revision: {type: string}
        since: {type: string, format: date-time}
        evaluated: {type: integer}
        changes: {type: array, items: {$ref: '#/components/schemas/PolicyChange'}}
    ScheduleInfo:
      type: object
      required: [name, cron, status, application, environment]
      properties:
        name: {type: string}
        cron: {type: string}
        timezone: {type: string}
        status: {type: string}
        tenant: {type: string}
        application: {type: string}
        environment: {type: string}
        requested_by: {type: string}
        last_fired_at: {type: string, format: date-time}
    DORAMetrics:
      type: object
      required: [deployments, failures, deployments_per_day, change_failure_rate]
      properties:
        application: {type: string}
        artifact: {type: string}
        environment: {type: string}
        tenant: {type: string}
        deployments: {type: integer}
        failures: {type: integer}
        deployments_per_day: {type: number}
        change_failure_rate: {type: number}
        mttr_seconds: {type: number}
        lead_time_seconds: {type: number}
    DORAReport:
      type: object
      required: [since, until, total, environments]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        total: {$ref: '#/components/schemas/DORAMetrics'}
        environments: {type: array, items: {$ref: '#/components/schemas/DORAMetrics'}}
    Redeploy:
      type: object
      properties:
        id: {type: string}
        dry_run: {type: boolean}
        freeze_override: {type: string, description: Reason for the freeze override}
    PromoteRequest:
      allOf:
        - $ref: '#/components/schemas/Redeploy'
        - type: object
          required: [application, from, to]
          properties:
            tenant: {type: string}
            application: {type: string}
            from: {type: string}
            to: {type: string}
            artifact: {type: string, description: "Artifact to promote; required if from has more than one"}
            version: {type: string}
            deploy: {$ref: '#/components/schemas/DeployTargets'}
            config_ref: {type: string, description: "Revision of the destination environment's configuration (git provider); default the default ref"}
    RollbackRequest:
      allOf:
        - $ref: '#/components/schemas/Redeploy'
        - type: object
          required: [application, environment]
          properties:
            tenant: {type: string}
            application: {type: string}
            environment: {type: string}
            artifact: {type: string, description: "Artifact to roll back; required if the environment has more than one"}
            version: {type: string}
    Grant:
      type: object
      required: [actions, applications, environments]
      properties:
        name: {type: string, description: Permission label (position of the binding or name given by the policy)}
        role: {type: string, description: Role the actions come from, if the permission names one}
        actions: {type: array, items: {type: string}}
        applications: {type: array, items: {type: string}}
        environments: {type: array, items: {type: string}}
        tenants: {type: string, description: Selector of the tenants the permission is limited to}
        selector: {type: string, description: Selector on the applications the permission is limited to}
        artifacts: {type: array, items: {type: string}, description: Patterns of the artifacts the permission is limited to}
        until: {type: string, format: date-time, description: Time at which the permission stops applying}
    PolicyAccessRequest:
      type: object
      required: [subject]
      properties:
        subject: {type: string, description: "<method>:<name> (e.g. oidc:alice); without a method, oidc"}
        groups: {type: array, items: {type: string}}
        claims: {type: object, additionalProperties: {type: string}}
        compare: {type: boolean, description: Also computes the permissions gained and lost compared with the active revision}
        check: {$ref: '#/components/schemas/AccessCheck'}
    AccessCheck:
      type: object
      required: [action]
      properties:
        action: {type: string}
        tenant: {type: string}
        application: {type: string}
        environment: {type: string}
        artifact: {type: string}
        descriptor: {$ref: '#/components/schemas/Descriptor'}
    PolicyAccess:
      type: object
      required: [revision, subject, grants]
      properties:
        revision: {type: string}
        subject: {type: string}
        grants: {type: array, items: {$ref: '#/components/schemas/Grant'}}
        warnings: {type: array, items: {type: string}, description: Permissions of the revision discarded because invalid or with policy.* actions}
        compared: {type: string, description: Active revision used for the comparison}
        gained: {type: array, items: {$ref: '#/components/schemas/Grant'}}
        lost: {type: array, items: {$ref: '#/components/schemas/Grant'}}
        check: {$ref: '#/components/schemas/AccessOutcome'}
    AccessOutcome:
      type: object
      required: [allowed]
      properties:
        allowed: {type: boolean}
        granted_by: {type: string, description: Name of the permission that allows the action}
        denied: {type: array, items: {type: string}, description: Reasons of the revision's denials (deny)}
        reason: {type: string, description: Reason of a refusal without denials}
    Identity:
      type: object
      required: [subject, name, method, auth_enabled, grants]
      properties:
        subject: {type: string}
        name: {type: string}
        method: {type: string}
        groups: {type: array, items: {type: string}}
        auth_enabled: {type: boolean}
        grants: {type: array, items: {$ref: '#/components/schemas/Grant'}}
        authz_engine: {type: string, description: Permission engine (opa); absent with the builtin engine}
        authz_revision: {type: string, description: Revision of the permission policy in force}
    UIConfig:
      type: object
      required: [auth_mode, version]
      properties:
        auth_mode: {type: string, enum: [none, oidc, unavailable]}
        issuer: {type: string}
        client_id: {type: string}
        scopes: {type: array, items: {type: string}}
        redirect_path: {type: string}
        version: {type: string}
