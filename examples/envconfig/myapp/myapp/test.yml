# Deploy configuration of myapp in the test environment.
# With the consul provider the content is the value of the manent/myapp/test key (YAML or JSON).
# Only secret references, never values: the configuration is saved in the deploy history.
plugin: remote-copy
policy: default
targets:
  - host: 192.168.1.10
    port: 22
    user: deploy
params:
  dest_dir: /opt/myapp/releases
  ssh_key_secret: deploy-key
  post_command: "systemctl restart myapp"
secrets:
  - name: deploy-key
    ref: env:DEPLOY_SSH_KEY
# The environment can impose automatic rollback (the descriptor cannot disable it),
# within the artifact type policy in manent.yml.
# rollback:
#   enabled: true
#   locator: plugin
