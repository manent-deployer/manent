# Recurring deploy: manent deploy -f examples/descriptor-scheduled.yml
# Creates (or updates, if a schedule with the same name exists) a DBOS schedule.
# At every tick a deploy is enqueued with ID "<name>@<UTC time>", e.g. myapp-nightly@20261010T000000Z.
apiVersion: manent/v1
application: myapp
environment: test

schedule:
  cron: "0 2 * * *"          # 5 fields, or 6 with seconds ("0 0 2 * * *") or "@daily"
  timezone: Europe/Rome      # optional, default: the executor's time zone
  name: myapp-nightly        # optional, default: <application>-<environment>

artifact:
  type: application
  name: myapp
  version: latest
  source: https://artifacts.example.com/myapp/myapp-latest.tar.gz

secrets:
  - name: deploy-key
    ref: env:DEPLOY_SSH_KEY

deploy:
  plugin: remote-copy
  targets:
    - host: 192.168.1.10
      user: deploy
  params:
    dest_dir: /opt/myapp/releases
    ssh_key_secret: deploy-key
