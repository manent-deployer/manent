# Deploy that starts only after other deploys succeed (CLI: manent deploy -f ... or
# --after <id>). While waiting it is WAITING_DEPENDENCY and takes no environment queue slot; if a
# dependency fails or the wait expires it becomes DEPENDENCY_FAILED.
apiVersion: manent/v1
id: shop-api-2.4.0-prod
application: shop-api
environment: prod
after:
  - shop-db-42-prod
afterTimeout: 2h
artifact:
  type: application
  name: shop-api
  version: 2.4.0
  source: https://artifacts.example.com/shop-api/2.4.0/shop-api-2.4.0.tar.gz
