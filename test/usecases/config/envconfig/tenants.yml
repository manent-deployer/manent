# Tenant registry of the use cases: the teams that own the applications. The generic cases use
# applications no tenant lists (tenant "untenanted", configuration under untenanted/); UC24 and
# UC25 use payments, retail, legacy and their tags. payments and retail both have uc24-shop:
# two releases, chosen with --tenant.
tenants:
  # UC24: the payments team, with its queue, its restrictions and the members of team-payments.
  # The owner tag gives the UC25 team its applications.
  payments:
    description: Team pagamenti
    tags: {division: commerce, contract: "2026", owner: team-uc25}
    applications:
      uc24-shop: {tags: {product: checkout, criticality: high}}
      uc24-billing: {tags: {product: invoicing, criticality: medium}}
    members: {groups: [team-payments]}
    queue: deployments.payments
    secret_refs: ["file:/keys/*"]
    artifact_sources: ["file:///srv/artifacts/uc24-"]
  # UC24: the retail team, with an application of the same name as one of payments.
  retail:
    description: Team negozi
    tags: {division: retail, contract: "2026"}
    applications:
      uc24-shop: {tags: {product: storefront}}
    members: {groups: [team-retail]}
  # UC24: a team with the 2025 contract, stopped at the 1.0 series by the Rego policy.
  legacy:
    description: Applicazioni con il contratto 2025
    tags: {division: commerce, contract: "2025"}
    applications:
      uc24-legacy: {tags: {product: archive}}
  # UC25: the team of uc25-api.
  uc25:
    tags: {division: platform}
    applications:
      uc25-api: {}
