# Default values of the manent chart. See docs/content/operazioni/installazione.md.

image:
  # Server image (manent-server, also with the manent client).
  repository: ghcr.io/joeg-ita/manent-server
  # Default: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# DBOS system database (Postgres). The URL, with the password, lives in an existing Secret:
#   kubectl create secret generic manent-db --from-literal=url='postgres://manent:...@pg:5432/manent'
database:
  existingSecret: manent-db
  key: url

# manent configuration (manent.yml), rendered into a ConfigMap. dbos.database_url comes from
# the Secret through DBOS_SYSTEM_DATABASE_URL; executor_id from the pod name (DBOS__VMID).
# observability.listen is fixed to :9090 by the chart, for the workers' probes and metrics.
config:
  app:
    name: manent
    version: "0.1.0"
  dbos:
    queue: deployments
    concurrency: 4
    environment_concurrency: 1
    drain_timeout: 5m
  logging:
    level: info
    format: json
  recovery:
    heartbeat_interval: 15s
    stale_after: 1m
    # With workers in a StatefulSet a removed pod (scale down) does not come back: its pending
    # workflows are resumed by another worker after this time.
    auto_recover_after: 10m
  retention:
    max_age: 2160h   # 90 days
    keep_releases: 10
  observability:
    metrics: true

api:
  enabled: true
  replicas: 2
  # manent-server arguments: API only, execution belongs to the workers.
  args: ["api"]
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 2
  # The pod name (manent-worker-0, -1, ...) is the executor_id: stable across restarts, so
  # every worker resumes its own interrupted deploys.
  podManagementPolicy: Parallel
  # Must exceed dbos.drain_timeout: the worker stops dequeuing deploys and waits for the running ones.
  terminationGracePeriodSeconds: 360
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Working directory for downloaded artifacts (it need not be shared).
  workdir:
    sizeLimit: 10Gi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Extra variables, volumes and mounts for API and workers: secrets (Vault token, SSH keys,
# Consul token, CAs), API token files, known_hosts.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Prometheus Operator ServiceMonitor for API and workers.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
