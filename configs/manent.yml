# Configurazione applicativa di manent (manent -c configs/manent.yml ...)
app:
  name: manent
  version: 0.1.0

dbos:
  # Sovrascrivibile con DBOS_SYSTEM_DATABASE_URL. Con più nodi serve Postgres: postgres://user:pass@host:5432/manent
  database_url: sqlite:manent.db
  # ID del worker: univoco tra i nodi e stabile tra i riavvii (es. nome del pod di uno StatefulSet).
  # Al riavvio un worker riprende solo i deploy interrotti con il proprio ID. Default: hostname; DBOS__VMID ha la precedenza.
  # executor_id: manent-0
  queue: deployments
  concurrency: 4                # deploy in esecuzione su ogni worker
  global_concurrency: 0         # deploy in esecuzione su tutti i worker (0 = nessun limite)
  environment_concurrency: 1    # deploy contemporanei della stessa application/environment su tutti i worker
  schedule_poll_interval: 30s   # ogni quanto le modifiche alle schedule ricorrenti vengono rilette

http:
  listen: ":8080"

logging:
  level: info             # debug | info | warn | error
  format: text            # text | json

siem:
  enabled: false
  network: udp            # udp | tcp
  address: siem.example.com:514

# Directory locale dove vengono scaricati gli artefatti (condivisa se più executor)
workdir: ./work

# Configurazione di deploy di ogni ambiente (plugin, target, parametri, riferimenti ai segreti),
# letta all'inizio di ogni deploy e fusa con il descrittore: il descrittore può solo aggiungere
# ciò che non è definito qui, i valori in conflitto fanno fallire il deploy.
envconfig:
  provider: none          # none | consul | file
  required: false         # true: fallisce se per l'ambiente non esiste configurazione
  max_retries: 3
  consul:
    address: http://127.0.0.1:8500     # default: CONSUL_HTTP_ADDR
    datacenter: ""
    key: "manent/{application}/{environment}"
    # token: da CONSUL_HTTP_TOKEN oppure da file
    # token_file: /run/secrets/consul-token
  file:
    path: "./examples/envconfig/{application}/{environment}.yml"

# Step disponibili, nell'ordine di esecuzione.
# mode: mandatory (sempre eseguito) | optional (enabled = default, sovrascrivibile dal descrittore)
pipeline:
  steps:
    - name: secrets
      mode: mandatory
    - name: artifacts
      mode: mandatory
      max_retries: 3
    - name: qa
      mode: optional
      enabled: true
    - name: deploy
      mode: mandatory
      max_retries: 2
    - name: post-test
      mode: optional
      enabled: false
      max_retries: 5
    - name: activation
      mode: optional
      enabled: true

# Plugin attivi e relativa configurazione
plugins:
  remote-copy:
    known_hosts: ~/.ssh/known_hosts
    insecure_ignore_host_key: false
    artifact_types: [application]
