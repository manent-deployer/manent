# HAProxy of the use case lab (UC10): load balancer in front of the eu-1 targets, managed by
# manent through the Data Plane API (started by entrypoint.sh). Backend uc10-shop is the pool drained per
# batch; backend uc10-blue holds the two slots of the percentage rollout (router).
global
  master-worker
  stats socket /var/run/haproxy/api.sock mode 660 level admin expose-fd listeners
  log stdout format raw local0 info

# Docker DNS: the targets may start after HAProxy.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 2s

defaults
  mode http
  default-server resolvers docker init-addr last,libc,none
  log global
  timeout connect 2s
  timeout client 30s
  timeout server 30s

frontend web
  bind :80
  use_backend uc10-blue if { path_beg /uc10-blue/ }
  default_backend uc10-shop

backend uc10-shop
  balance roundrobin
  option httpchk GET /up
  default-server check inter 1s fall 1 rise 1
  server eu1-a eu1-a:8080
  server eu1-b eu1-b:8080
  server eu1-c eu1-c:8080

# No slot receives traffic before the first release: manent releases it to slot a.
backend uc10-blue
  balance roundrobin
  server eu1-a eu1-a:8080 weight 0
  server eu1-b eu1-b:8080 weight 0
