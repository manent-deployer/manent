# UC3: multiple workers, recovery and drain.
# Use cases (test/usecases): targets, parameters and secrets of the environment.
plugin: remote-copy
targets:
  - {host: eu1-b, user: deploy, labels: {region: eu-1, az: eu-1b}}
params:
  dest_dir: /home/deploy/apps/uc3-batch
  layout: releases
  keep_releases: "3"
  ssh_key_secret: deploy-key
  prepare_command: 'tar -xzf "$MANENT_ARTIFACT" -C "$MANENT_RELEASE_DIR"'
  # Faults simulated by the use cases: $HOME/fault/uc3-batch.sleep (wait) and .fail (error).
  post_command: 'f=$HOME/fault/uc3-batch; echo "$(date +%s) start $MANENT_VERSION" >> $f.log; if [ -f $f.sleep ]; then sleep $(cat $f.sleep); fi; echo "$(date +%s) end $MANENT_VERSION" >> $f.log; if [ -e $f.fail ]; then echo "guasto simulato su $(hostname)" >&2; exit 1; fi'
  rollback_command: "true"
secrets:
  - name: deploy-key
    ref: file:/keys/id
