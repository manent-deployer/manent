# manent release (GoReleaser v2): binaries, image, signed checksums and SBOM.
# Run by the .github/workflows/release.yml workflow on a vX.Y.Z tag.
version: 2
project_name: manent

before:
  hooks:
    - go mod download
    # Web interface embedded in manent-server (Node >= 20 or Docker).
    - make web

builds:
  # Client: talks only to the API, for developers and CI.
  - id: manent
    main: ./cmd/manent
    binary: manent
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/manent-deployer/manent/internal/version.Version={{ .Version }}
      - -X github.com/manent-deployer/manent/internal/version.Commit={{ .FullCommit }}
      - -X github.com/manent-deployer/manent/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  # Server: API, workers and platform operations.
  - id: manent-server
    main: ./cmd/manent-server
    binary: manent-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: *ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: manent-plugin-remote-copy
    main: ./cmd/manent-plugin-remote-copy
    binary: manent-plugin-remote-copy
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: client
    ids: [manent]
    name_template: "manent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]
  - id: server
    ids: [manent-server, manent, manent-plugin-remote-copy]
    name_template: "manent-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/manent.yml
      - deploy/systemd/*

checksum:
  name_template: checksums.txt

# SPDX SBOM of every archive (requires syft).
sboms:
  - artifacts: archive

# Keyless signature (Sigstore) of the checksum file: verify with cosign verify-blob.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

dockers_v2:
  - id: server
    ids: [manent-server, manent, manent-plugin-remote-copy]
    images: [ghcr.io/manent-deployer/manent-server]
    tags: ["{{ .Version }}", "latest"]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    labels: &labels
      org.opencontainers.image.source: https://github.com/manent-deployer/manent
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
  - id: client
    ids: [manent]
    images: [ghcr.io/manent-deployer/manent]
    tags: ["{{ .Version }}", "latest"]
    dockerfile: Dockerfile.client.release
    platforms: [linux/amd64, linux/arm64]
    labels: *labels

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: [sign, "${artifact}@${digest}", --yes]

changelog:
  disable: true

release:
  # Release notes are the version's section in CHANGELOG.md
  # (goreleaser release --release-notes, see release.yml).
  draft: false
