// Protocol between manent (host) and external deploy plugins, run as separate processes
// through github.com/hashicorp/go-plugin. Regenerate with "make proto".
syntax = "proto3";

package manent.plugin.v1;

option go_package = "github.com/joeg-ita/manent/pkg/plugin/external/proto;pluginpb";

// Deployer is implemented by the plugin. It mirrors plugin.Deployer and the optional interfaces
// plugin.DryRunner, plugin.ReleaseInspector and plugin.Rollbacker.
service Deployer {
  // Configure builds the deployer with the manent.yml configuration. It is the first call
  // after the process starts and is repeated at every restart.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  rpc Supports(SupportsRequest) returns (SupportsResponse);
  rpc Validate(DeployRequest) returns (Empty);
  rpc Deploy(DeployRequest) returns (DeployResponse);
  // DryRun returns UNIMPLEMENTED if the plugin does not support dry-run.
  rpc DryRun(DeployRequest) returns (DeployResponse);
  // CurrentRelease reads the release in service from the targets; UNIMPLEMENTED if unsupported.
  rpc CurrentRelease(DeployRequest) returns (CurrentReleaseResponse);
  // Rollback brings the targets back to the given release; UNIMPLEMENTED if unsupported.
  rpc Rollback(RollbackRequest) returns (DeployResponse);

  // Percentage rollouts (plugin.SlotDeployer, plugin.TrafficRouter, plugin.TesterRouter,
  // plugin.SlotScaler): UNIMPLEMENTED if unsupported. DeployRequest.traffic carries the state
  // recorded by PrepareSlots.
  rpc PrepareSlots(DeployRequest) returns (StateResponse);
  rpc DeployCandidate(DeployRequest) returns (DeployResponse);
  rpc PromoteCandidate(DeployRequest) returns (Empty);
  rpc RevertCandidate(DeployRequest) returns (Empty);
  rpc RetirePrevious(DeployRequest) returns (Empty);
  rpc SetCandidateWeight(WeightRequest) returns (Empty);
  rpc CandidateWeight(DeployRequest) returns (WeightResponse);
  rpc RouteTesters(DeployRequest) returns (DetailsResponse);
  rpc ScaleCandidate(WeightRequest) returns (Empty);
}

// Secrets is served by manent for the duration of a Deploy or DryRun call, through the
// go-plugin broker: the plugin reads secrets only when needed and never receives them upfront.
service Secrets {
  rpc Secret(SecretRequest) returns (SecretResponse);
}

message Empty {}

message ConfigureRequest {
  // Plugin configuration in JSON (plugins.<name> section without the external key).
  bytes config_json = 1;
}

message ConfigureResponse {
  string name = 1;
  // Optional interfaces implemented by the plugin: "dry_run", "current_release", "rollback",
  // "slots", "traffic_router", "testers", "scale".
  // A plugin built with an earlier SDK declares none.
  repeated string capabilities = 2;
}

message SupportsRequest {
  string artifact_type = 1;
}

message SupportsResponse {
  bool supported = 1;
}

message Artifact {
  string type = 1;
  string name = 2;
  string version = 3;
  // Local path on the worker: the plugin runs on the same machine.
  string local_path = 4;
  string sha256 = 5;
}

message Target {
  string host = 1;
  int32 port = 2;
  string user = 3;
}

message DeployRequest {
  string deployment_id = 1;
  string application = 2;
  string environment = 3;
  Artifact artifact = 4;
  repeated Target targets = 5;
  map<string, string> params = 6;
  // ID of the broker Secrets is served on (0 = no resolver, e.g. in Validate).
  uint32 secrets_broker_id = 7;
  // Present only in percentage rollouts.
  TrafficRequest traffic = 8;
}

message TrafficRequest {
  map<string, string> state = 1;
  string tester_header = 2;
  string tester_tag = 3;
  bool proportional_replicas = 4;
}

message StateResponse {
  map<string, string> state = 1;
}

message WeightRequest {
  DeployRequest request = 1;
  int32 percent = 2;
}

message WeightResponse {
  int32 percent = 1;
}

message DetailsResponse {
  map<string, string> details = 1;
}

message TargetResult {
  string host = 1;
  string status = 2;
  map<string, string> details = 3;
}

message DeployResponse {
  string plugin = 1;
  repeated TargetResult targets = 2;
}

message SecretRequest {
  string name = 1;
}

message SecretResponse {
  string value = 1;
}

message Release {
  string version = 1;
  map<string, string> details = 2;
}

message CurrentReleaseResponse {
  // Absent if the targets have no release (first deploy).
  Release release = 1;
}

message RollbackRequest {
  DeployRequest request = 1;
  Release previous = 2;
}
