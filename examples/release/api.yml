# "api" deploy of the sample release (examples/release.yml). Without an id: in the release
# it gets the ID "<release>.api".
apiVersion: manent/v1
application: shop-api
environment: prod
artifact:
  type: application
  name: shop-api
  version: 2.4.0
  source: https://artifacts.example.com/shop-api/2.4.0/shop-api-2.4.0.tar.gz
